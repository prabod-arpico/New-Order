<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Order | Prabodfx</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        :root {
            --neon-cyan: #06b6d4;
            --neon-blue: #3b82f6;
            --neon-red: #ef4444;
            --neon-green: #10b981;
            --bg-dark: #020617;
            --glass-panel: rgba(15, 23, 42, 0.90);
            --border-color: rgba(6, 182, 212, 0.3);
            --header-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            color: #f1f5f9;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* --- LOADER --- */
        #loader {
            position: fixed; inset: 0; background: #020617; z-index: 10000;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(6,182,212,0.1);
            border-top-color: var(--neon-cyan); border-radius: 50%;
            animation: spin 1s infinite linear;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- HEADER --- */
        header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--header-height);
            background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .brand {
            font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text; color: transparent;
            cursor: pointer; user-select: none;
        }
        .date-badge {
            font-family: 'Cinzel'; border: 1px solid var(--border-color);
            padding: 5px 15px; border-radius: 20px; font-size: 0.8rem;
            color: var(--neon-cyan); background: rgba(6,182,212,0.05);
        }

        /* --- LAYOUT --- */
        .main-container {
            margin-top: var(--header-height);
            padding: 20px;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
            transition: all 0.3s ease;
        }

        .desktop-wrapper { display: flex; gap: 30px; position: relative; }
        .content-area { flex: 1; width: 100%; transition: width 0.3s ease; }

        /* --- SIDEBAR --- */
        #desktopSuggestionsPanel {
            position: fixed; top: calc(var(--header-height) + 20px); right: 20px;
            width: 350px; height: calc(100vh - 120px);
            background: rgba(15, 23, 42, 0.95); border: 1px solid var(--neon-cyan);
            border-radius: 16px; backdrop-filter: blur(20px);
            box-shadow: -10px 10px 30px rgba(0,0,0,0.5);
            z-index: 900; transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; overflow: hidden;
        }
        #desktopSuggestionsPanel.active { transform: translateX(0); }
        @media (min-width: 1200px) { body.sidebar-open .content-area { margin-right: 370px; } }

        .sidebar-header {
            padding: 15px 20px; background: rgba(6, 182, 212, 0.1);
            border-bottom: 1px solid var(--border-color); color: var(--neon-cyan);
            font-family: 'Cinzel'; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
        }
        #desktopSuggestionsContent { flex: 1; overflow-y: auto; padding: 15px; }

        /* --- CARDS --- */
        .glass-card {
            background: var(--glass-panel); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 25px; margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative;
        }
        .glass-card::before {
            content:''; position: absolute; top:0; left:0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--neon-cyan), var(--neon-blue));
            border-radius: 16px 0 0 16px; opacity: 0.7;
        }

        h2 { font-family: 'Cinzel'; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
        h2 i { color: var(--neon-cyan); }

        /* --- INPUTS --- */
        .form-group { margin-bottom: 20px; position: relative; }
        label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        
        input, select, textarea {
            width: 100%; padding: 14px 16px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; color: #fff; font-size: 1rem; transition: all 0.3s;
        }
        
        .uppercase-input { text-transform: uppercase; }

        input:focus, textarea:focus, select:focus {
            border-color: var(--neon-cyan); background: rgba(6, 182, 212, 0.05);
            box-shadow: 0 0 15px rgba(6,182,212,0.15);
        }

        textarea { resize: vertical; min-height: 80px; font-family: 'Inter', sans-serif; }

        .premium-select { position: relative; cursor: pointer; }
        .premium-select select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 45px; background:rgb(15, 15, 180); border: 1px solid rgba(6, 182, 212, 0.3); }
        .premium-select::after {
            content: '\f107'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: var(--neon-cyan); pointer-events: none; transition: transform 0.3s;
        }
        .premium-select:hover::after { transform: translateY(-50%) scale(1.2); }
        .premium-select option { background: #000000; color: rgb(255, 255, 255); padding: 10px; }

        /* --- MOBILE ITEM CARDS --- */
        .mobile-item-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative;
        }
        .mobile-item-card.focused { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(6,182,212,0.1); background: rgba(6,182,212,0.02); }
        .mobile-item-card.is-msg { border-color: var(--neon-blue); background: rgba(59, 130, 246, 0.05); }

        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-del {
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444; width: 35px; height: 35px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .total-display { text-align: center; color: var(--neon-cyan); font-family: 'Cinzel'; font-weight: bold; display: flex; flex-direction: column; justify-content: center; height: 100%; font-size: 0.9rem; }

        /* --- SUGGESTIONS --- */
        .mobile-suggestions {
            background: rgba(15, 23, 42, 0.98); border: 1px solid var(--neon-cyan); border-top: none;
            border-radius: 0 0 10px 10px; max-height: 200px; overflow-y: auto;
            display: none; margin-top: -2px; position: relative; z-index: 10;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .suggestion-item { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: background 0.2s; }
        .suggestion-item:hover { background: rgba(6, 182, 212, 0.15); }
        .s-main { font-weight: 600; color: #fff; font-size: 0.95rem; }
        .s-sub { font-size: 0.75rem; color: #94a3b8; display: flex; justify-content: space-between; margin-top: 3px; }

        /* --- ADD BUTTON --- */
        .btn-add {
            width: 100%; padding: 15px; margin-top: 10px;
            background: rgba(6,182,212,0.05); border: 1px dashed var(--neon-cyan);
            color: var(--neon-cyan); border-radius: 12px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-add:hover { background: rgba(6,182,212,0.15); }

        /* --- FOOTER --- */
        .action-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-color); padding: 15px 20px; z-index: 1000;
        }
        .action-inner { max-width: 1600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        
        .footer-totals { 
            display: grid; 
            grid-template-columns: auto auto; 
            gap: 30px; 
            align-items: center;
        }
        .f-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
        }
        .f-item small { display: block; font-size: 0.65rem; color: #64748b; font-weight: 700; letter-spacing: 1px; margin-bottom: 2px; }
        .f-item span { font-family: 'Cinzel'; font-size: 1.2rem; color: var(--neon-cyan); line-height: 1; }

        .footer-btns { display: flex; gap: 10px; }
        .btn { padding: 12px 25px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: transform 0.2s; }
        .btn:active { transform: scale(0.96); }
        .btn-submit { background: linear-gradient(135deg, var(--neon-blue), #2563eb); color: white; box-shadow: 0 0 15px rgba(59,130,246,0.4); }
        .btn-cancel { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.5); }
        .btn-ok { background: var(--neon-cyan); color: #020617; box-shadow: 0 0 20px rgba(6,182,212,0.4); }

        /* --- MODAL SYSTEM --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px); z-index: 9999;
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.open { display: flex; opacity: 1; }
        
        .modal-content {
            background: linear-gradient(145deg, rgba(15,23,42,0.98), rgba(2,6,23,0.98));
            border: 1px solid var(--neon-cyan);
            border-radius: 16px; width: 90%; max-width: 500px;
            padding: 0; /* Reset padding for internal structure */
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.15);
            transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column;
        }
        .modal-overlay.open .modal-content { transform: scale(1); }
        
        /* PREMIUM SUMMARY STYLES */
        .ps-header {
            padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center; background: rgba(255,255,255,0.02);
        }
        .ps-header h3 { font-family: 'Cinzel'; color: #fff; margin: 0; font-size: 1.4rem; }
        .ps-header small { color: var(--neon-cyan); font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; }

        .ps-body { padding: 20px; overflow-y: auto; }

        .ps-customer-card {
            background: rgba(6, 182, 212, 0.05); border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 12px; padding: 15px; margin-bottom: 20px;
            display: flex; gap: 15px; align-items: center;
        }
        .ps-c-icon { 
            width: 40px; height: 40px; background: rgba(6,182,212,0.1); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; color: var(--neon-cyan);
        }
        .ps-c-info h4 { color: #fff; font-size: 1rem; margin-bottom: 2px; }
        .ps-c-info p { color: #94a3b8; font-size: 0.8rem; margin: 0; }

        .ps-table-head {
            display: grid; grid-template-columns: 2fr 1fr 1fr;
            font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase;
            padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px;
        }
        .ps-item {
            display: grid; grid-template-columns: 2fr 1fr 1fr; align-items: center;
            padding: 10px 0; border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .ps-item:last-child { border-bottom: none; }
        
        .ps-i-desc { color: #e2e8f0; font-weight: 500; font-size: 0.9rem; line-height: 1.2; }
        .ps-i-desc small { display: block; color: #64748b; font-size: 0.7rem; margin-top: 2px; }
        
        .ps-i-qty { display: flex; justify-content: center; }
        .qty-badge {
            background: rgba(59, 130, 246, 0.15); color: var(--neon-blue);
            border: 1px solid rgba(59, 130, 246, 0.3); padding: 2px 10px;
            border-radius: 20px; font-weight: 700; font-size: 0.85rem; min-width: 40px; text-align: center;
        }
        
        .ps-i-total { text-align: right; color: #fff; font-weight: 600; }

        .ps-footer {
            padding: 20px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.1);
        }
        .ps-total-row {
            display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;
        }
        .ps-total-row span:first-child { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; }
        .ps-total-val { font-family: 'Cinzel'; font-size: 1.8rem; color: var(--neon-cyan); line-height: 1; text-shadow: 0 0 20px rgba(6,182,212,0.3); }

        .ps-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* Warning/Error Modal (Red) */
        .modal-content.warning { 
            border-color: var(--neon-red); box-shadow: 0 0 30px rgba(239, 68, 68, 0.2); 
            text-align: center; padding: 30px;
        }
        .warning-icon { font-size: 3rem; color: var(--neon-red); margin-bottom: 15px; }
        .warning-text { color: #cbd5e1; margin-bottom: 20px; }

        /* Success Popup (Green) */
        #successPopup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            background: #020617; border: 2px solid var(--neon-green);
            padding: 40px; border-radius: 20px; z-index: 10000; text-align: center;
            box-shadow: 0 0 50px rgba(16, 185, 129, 0.3);
            display: none; opacity: 0; transition: all 0.4s ease;
        }
        #successPopup.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .success-icon { font-size: 4rem; color: var(--neon-green); margin-bottom: 20px; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* History Styles */
        .history-item { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); 
            padding: 15px; margin-bottom: 10px; border-radius: 8px; text-align: left;
        }
        .h-head { display: flex; justify-content: space-between; color: var(--neon-cyan); font-weight: bold; margin-bottom: 5px; }
        .h-details { font-size: 0.85rem; color: #aaa; }

        @media (min-width: 768px) {
            .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            .mobile-suggestions { display: none !important; }
        }
        @media (max-width: 767px) {
            #desktopSuggestionsPanel { display: none !important; }
            .main-container { padding: 10px; padding-bottom: 400px; }
            .glass-card { padding: 15px; }
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div style="margin-top: 20px; color: var(--neon-cyan); font-family: 'Cinzel'; font-size: 1.2rem;">LOADING PORTAL</div>
    </div>

    <div id="successPopup">
        <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
        <h2 style="color:#fff; font-family:'Cinzel'; margin-bottom:10px;">ORDER CONFIRMED</h2>
        <p style="color:#94a3b8;">Saved & Resetting...</p>
    </div>

    <div id="alertModal" class="modal-overlay">
        <div class="modal-content warning">
            <div class="warning-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <h2 style="color:var(--neon-red); font-family:'Cinzel'; margin-bottom:10px;">ATTENTION</h2>
            <p id="alertMessage" class="warning-text"></p>
            <button class="btn btn-cancel" onclick="closeModal('alertModal')" style="width:100%">OK, I UNDERSTAND</button>
        </div>
    </div>

    <div id="summaryModal" class="modal-overlay">
        <div class="modal-content">
            <div class="ps-header">
                <h3>INVOICE PREVIEW</h3>
                <small>Verify details before saving</small>
            </div>
            
            <div class="ps-body">
                <div id="psCustomer" class="ps-customer-card">
                    </div>

                <div class="ps-table-head">
                    <div>Description</div>
                    <div style="text-align:center">Qty</div>
                    <div style="text-align:right">Amount</div>
                </div>

                <div id="psItemsList">
                    </div>
            </div>

            <div class="ps-footer">
                <div class="ps-total-row">
                    <span>Grand Total</span>
                    <span class="ps-total-val" id="psTotal">0.00</span>
                </div>
                <div class="ps-actions">
                    <button class="btn btn-cancel" onclick="closeModal('summaryModal')">MODIFY</button>
                    <button class="btn btn-ok" id="btnConfirmSubmit">CONFIRM & SAVE</button>
                </div>
            </div>
        </div>
    </div>

    <div id="historyModal" class="modal-overlay">
        <div class="modal-content" style="max-width:600px; padding:20px;">
            <div class="modal-header" style="text-align:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; margin-bottom:10px; font-family:'Cinzel'; color:var(--neon-cyan);">
                RECENT ORDER HISTORY
            </div>
            <div style="text-align: center; color: #64748b; font-size: 0.8rem; margin-bottom: 15px;">(Read Only View)</div>
            <div id="historyContent">Loading...</div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal('historyModal')">CLOSE PANEL</button>
            </div>
        </div>
    </div>

    <header>
        <div class="brand" ondblclick="location.reload()" title="Double Tap to Reset">
            <i class="fa-solid fa-cube"></i> NEW ORDER
        </div>
        <div class="date-badge" id="currentDate"></div>
    </header>

    <aside id="desktopSuggestionsPanel">
        <div class="sidebar-header">
            <span><i class="fa-solid fa-lightbulb"></i> SUGGESTIONS</span>
        </div>
        <div id="desktopSuggestionsContent"></div>
    </aside>

    <div class="main-container">
        <div class="desktop-wrapper">
            <div class="content-area">
                
                <div class="glass-card">
                    <h2><i class="fa-solid fa-user-check"></i> Customer Details</h2>
                    
                    <div class="grid-2">
                        <div class="form-group" id="group-cust">
                            <label>Customer Name / Search</label>
                            <input type="text" id="customerInput" placeholder="Type name or code..." autocomplete="off">
                            <div class="mobile-suggestions" id="mobile-cust-suggestions"></div>
                        </div>
                        
                        <div class="form-group">
                            <label>Customer Code</label>
                            <input type="text" id="custCode" style="color:var(--neon-cyan); font-weight:600;" autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="custAddress" autocomplete="off">
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Mobile</label>
                            <input type="text" id="custMobile" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label>Sales Representative</label>
                            <div class="premium-select">
                                <select id="repSelect">
                                    <option value="">Select Representative...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass-card">
                    <h2><i class="fa-solid fa-cart-shopping"></i> Order Items</h2>
                    <div id="itemsContainer"></div>
                    <button class="btn-add" id="btnAddRow">
                        <i class="fa-solid fa-plus-circle"></i> ADD NEW LINE
                    </button>
                </div>

            </div>
        </div>
    </div>

    <div class="action-bar">
        <div class="action-inner">
            <div class="footer-totals">
                <div class="f-item">
                    <small>ITEM COUNT</small>
                    <span id="totalQty">0</span>
                </div>
                <div class="f-item">
                    <small>GRAND TOTAL</small>
                    <span id="grandTotal">0.00</span>
                </div>
            </div>
            <div class="footer-btns">
                <button class="btn btn-submit" id="btnPreSubmit">SUBMIT ORDER</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyA5o9ttyPpOmRu0zVSUJ6g3H1mf05FkgW4",
            authDomain: "reps-a1259.firebaseapp.com",
            databaseURL: "https://reps-a1259-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "reps-a1259",
            storageBucket: "reps-a1259.firebasestorage.app",
            messagingSenderId: "537453276765",
            appId: "1:537453276765:web:53ebf8674f1bd36a04e7b4",
            measurementId: "G-1S0ME1X96X"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        // STATE
        let customersData = [];
        let itemsData = [];
        const isMobile = () => window.innerWidth < 768;

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString();

        // --- FORCE RESET ON LOAD TO FIX PERSISTENCE ---
        function resetForm() {
            document.querySelectorAll('input').forEach(i => i.value = '');
            const repSel = document.getElementById('repSelect');
            if(repSel) repSel.selectedIndex = 0;
            document.getElementById('itemsContainer').innerHTML = ''; // Clear items
            document.getElementById('totalQty').innerText = '0';
            document.getElementById('grandTotal').innerText = '0.00';
            // We will re-add one empty row after loading data
        }

        window.addEventListener('load', resetForm);

        // --- GLOBAL KEY NAVIGATION & ENTER LOGIC ---
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') {
                const current = e.target;

                // SPECIAL "SAVE" COMMAND IN CUST CODE
                if(current.id === 'custCode' && current.value.trim().toLowerCase() === 'save') {
                    e.preventDefault();
                    current.value = ''; 
                    fetchHistory(); 
                    return;
                }

                e.preventDefault();
                
                // 1. MG COMMAND
                if(current.classList.contains('i-code') && current.value.toLowerCase() === 'mg') {
                    transformToMsgBox(current);
                    return;
                }

                // 2. NAVIGATE & AUTO-CLEAR
                const focusable = Array.from(document.querySelectorAll('input:not([type=hidden]):not([disabled]), select, textarea'));
                const index = focusable.indexOf(current);
                
                if (index > -1 && index < focusable.length - 1) {
                    const next = focusable[index + 1];
                    next.focus();
                    if (next.value === '0.00' || next.value === '0') next.value = '';
                } else {
                    // 3. AUTO ADD NEW LINE
                    const lastCard = document.querySelector('#itemsContainer').lastElementChild;
                    if (lastCard && lastCard.contains(current) && current.classList.contains('i-price')) {
                        addItemRow();
                        setTimeout(() => {
                            const newLast = document.querySelector('#itemsContainer').lastElementChild;
                            const newCode = newLast.querySelector('.i-code');
                            if(newCode) newCode.focus();
                        }, 50);
                    }
                }
            }
        });

        // --- MODAL UTILS ---
        window.closeModal = (id) => {
            document.getElementById(id).classList.remove('open');
        };

        window.showAlert = (msg) => {
            document.getElementById('alertMessage').innerText = msg;
            document.getElementById('alertModal').classList.add('open');
        };

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('open');
                }
            });
        });

        // --- HISTORY / PREVIEW LOGIC ---
        window.fetchHistory = async () => {
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('historyContent');
            modal.classList.add('open');
            content.innerHTML = '<div style="text-align:center"><div class="spinner"></div><br>Fetching Records...</div>';

            try {
                const q = query(collection(db, "orders"), orderBy("timestamp", "desc"), limit(10));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    content.innerHTML = '<div style="text-align:center; padding:20px;">No history available.</div>';
                    return;
                }

                let html = '';
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const date = data.date || 'N/A';
                    
                    const itemsStr = data.items.map(i => {
                        if(i.code === 'MSG') return `<div><em>Msg: ${i.desc}</em></div>`;
                        return `<div>${i.code} x ${i.qty} = ${i.total.toFixed(2)}</div>`;
                    }).join('');

                    html += `
                        <div class="history-item">
                            <div class="h-head">
                                <span>${data.customer.name}</span>
                                <span>${data.grandTotal.toFixed(2)}</span>
                            </div>
                            <div class="h-details">
                                Date: ${date} | Code: ${data.customer.code}
                            </div>
                            <div style="margin:10px 0; border-left:2px solid var(--neon-cyan); padding-left:10px; font-size:0.85rem;">
                                ${itemsStr}
                            </div>
                        </div>
                    `;
                });
                content.innerHTML = html;

            } catch (e) {
                content.innerHTML = `Error: ${e.message}`;
            }
        };

        function transformToMsgBox(inputEl) {
            const card = inputEl.closest('.mobile-item-card');
            card.classList.add('is-msg');
            card.innerHTML = `
                <div class="item-header">
                    <div style="flex:1; color: var(--neon-blue); font-weight:bold;">
                        <i class="fa-solid fa-comment-dots"></i> SPECIAL MESSAGE
                    </div>
                    <div onclick="this.closest('.mobile-item-card').remove(); calcTotal();" class="btn-del">
                        <i class="fa-solid fa-trash"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Message Content</label>
                    <textarea class="msg-content" placeholder="Type your message here..."></textarea>
                </div>
            `;
            setTimeout(() => {
                const ta = card.querySelector('textarea');
                if(ta) ta.focus();
            }, 100);
            calcTotal();
        }

        // --- DATA LOADING ---
        async function loadData() {
            try {
                const snap = await get(child(ref(rtdb), "encryption_keys"));
                if(!snap.exists()) throw new Error("Key fetch failed");
                const keys = snap.val();
                
                const keyHex = CryptoJS.enc.Hex.parse(keys.itemsKey || keys.key);
                const ivHex = CryptoJS.enc.Hex.parse(keys.itemsIv || keys.iv);

                const decrypt = async (file) => {
                    const res = await fetch(`https://raw.githubusercontent.com/prabod-arpico/New-Order/refs/heads/main/database/${file}`);
                    const buff = await res.arrayBuffer();
                    const wa = CryptoJS.lib.WordArray.create(buff);
                    const dec = CryptoJS.AES.decrypt(
                        { ciphertext: wa }, keyHex, 
                        { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
                    );
                    return JSON.parse(dec.toString(CryptoJS.enc.Utf8));
                };

                const [rawCust, rawItm, rawReps] = await Promise.all([
                    decrypt("Customer.json.enc"),
                    decrypt("Items.json.enc"),
                    getDocs(collection(db, "reps"))
                ]);

                customersData = normalize(rawCust, 'customer');
                itemsData = normalize(rawItm, 'item');

                const repSel = document.getElementById('repSelect');
                const reps = [];
                rawReps.forEach(d => reps.push(d.data().name));
                reps.sort().forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = opt.text = r;
                    repSel.appendChild(opt);
                });

                document.getElementById('loader').style.display = 'none';
                addItemRow(); // Add first row only after load
                
            } catch (e) {
                showAlert("Error loading data: " + e.message);
                document.getElementById('loader').style.display = 'none';
            }
        }

        function normalize(data, type) {
            if(!Array.isArray(data)) return [];
            return data.map(item => {
                const k = Object.keys(item);
                if(type === 'customer') {
                    return {
                        name: item[k.find(x => /name/i.test(x)) || 'name'] || '',
                        code: item[k.find(x => /code/i.test(x)) || 'code'] || '',
                        address: item[k.find(x => /address/i.test(x)) || 'address'] || '',
                        mobile: item[k.find(x => /mobile|phone/i.test(x)) || 'mobile'] || ''
                    };
                } else {
                    return {
                        code: item[k.find(x => /code/i.test(x)) || 'code'] || '',
                        desc: item[k.find(x => /desc/i.test(x)) || 'description'] || '',
                        price: parseFloat(item[k.find(x => /price|rate/i.test(x)) || 'price']) || 0
                    };
                }
            });
        }

        loadData();

        // --- UI LOGIC ---

        function handleMobileFocus(element) {
            if(!isMobile()) return;
            setTimeout(() => {
                const headerOffset = 80;
                const elementPosition = element.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                window.scrollTo({ top: offsetPosition, behavior: "smooth" });
                const card = element.closest('.mobile-item-card');
                if(card) {
                    document.querySelectorAll('.mobile-item-card').forEach(c => c.classList.remove('focused'));
                    card.classList.add('focused');
                }
            }, 300);
        }

        function toggleDesktopPanel(show, contentHTML = "") {
            const panel = document.getElementById('desktopSuggestionsPanel');
            const body = document.body;
            if(!panel) return;

            if (show && !isMobile()) {
                document.getElementById('desktopSuggestionsContent').innerHTML = contentHTML;
                panel.classList.add('active');
                body.classList.add('sidebar-open');
            } else {
                panel.classList.remove('active');
                body.classList.remove('sidebar-open');
            }
        }

        document.addEventListener('click', (e) => {
            if(!e.target.closest('input') && !e.target.closest('#desktopSuggestionsPanel')) {
                toggleDesktopPanel(false);
            }
        });

        // --- CUSTOMER SEARCH ---
        const custInput = document.getElementById('customerInput');
        
        custInput.addEventListener('dblclick', () => {
            custInput.value = '';
            document.getElementById('custCode').value = '';
            document.getElementById('custAddress').value = '';
            document.getElementById('custMobile').value = '';
        });

        custInput.addEventListener('focus', () => {
            handleMobileFocus(custInput);
            renderSuggestions(custInput.value, 'customer');
        });

        custInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if(!val) {
                document.getElementById('custCode').value = '';
                document.getElementById('custAddress').value = '';
                document.getElementById('custMobile').value = '';
            }
            const exact = customersData.find(c => c.code.toLowerCase() === val.toLowerCase() || c.name.toLowerCase() === val.toLowerCase());
            if(exact) {
                selectCustomer(exact);
            }
            renderSuggestions(val, 'customer');
        });

        function renderSuggestions(query, type, contextEl = null) {
            let matches = [];
            const q = query.toLowerCase();

            if (type === 'customer') {
                matches = customersData.filter(c => c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q)).slice(0, 20);
            } else {
                matches = itemsData.filter(i => i.code.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)).slice(0, 20);
            }

            const html = matches.length ? matches.map(m => {
                if (type === 'customer') {
                    return `<div class="suggestion-item">
                        <div class="s-main">${m.name}</div>
                        <div class="s-sub"><span>${m.address}</span><span>${m.code}</span></div>
                    </div>`;
                } else {
                    return `<div class="suggestion-item">
                        <div class="s-main">${m.code} <br> ↪ ${m.desc} </div>
                    </div>`;
                }
            }).join('') : '<div style="padding:20px; text-align:center; color:#64748b;">No matches found</div>';

            const attachListeners = (container) => {
                container.querySelectorAll('.suggestion-item').forEach((el, idx) => {
                    el.addEventListener('click', () => {
                        if(type === 'customer') selectCustomer(matches[idx]);
                        else selectItem(matches[idx], contextEl);
                        if(isMobile()) container.style.display = 'none';
                        else toggleDesktopPanel(false);
                    });
                });
            };

            if (isMobile()) {
                const target = type === 'customer' ? 
                    document.getElementById('mobile-cust-suggestions') : 
                    contextEl.parentNode.querySelector('.mobile-suggestions');
                target.innerHTML = html;
                target.style.display = matches.length ? 'block' : 'none';
                attachListeners(target);
            } else {
                toggleDesktopPanel(true, html);
                attachListeners(document.getElementById('desktopSuggestionsContent'));
            }
        }

        window.selectCustomer = (c) => {
            if(typeof c === 'string') c = customersData.find(x => x.code === c);
            if(!c) return;
            document.getElementById('customerInput').value = c.name;
            document.getElementById('custCode').value = c.code;
            document.getElementById('custAddress').value = c.address;
            document.getElementById('custMobile').value = c.mobile;
        };

        window.selectItem = (item, inputElement) => {
            const card = inputElement.closest('.mobile-item-card');
            const inputs = card.querySelectorAll('input');
            
            inputs[0].value = item.code;
            inputs[1].value = item.desc;
            inputs[3].value = item.price.toFixed(2);
            inputs[0].dataset.lastValid = item.code;
            calcRow(card);
            
            inputs[2].focus();
            if(inputs[2].value === '0') inputs[2].value = '';
        };

        // --- DYNAMIC ITEMS ---
        const itemsContainer = document.getElementById('itemsContainer');

        window.addItemRow = () => {
            const div = document.createElement('div');
            div.className = 'mobile-item-card fade-in';
            div.innerHTML = `
                <div class="item-header">
                    <div style="flex:1">
                        <label>Item Code</label>
                        <input type="text" class="i-code uppercase-input" placeholder="Search Code/Name" autocomplete="off">
                        <div class="mobile-suggestions"></div>
                    </div>
                    <div onclick="this.closest('.mobile-item-card').remove(); calcTotal();" class="btn-del">
                        <i class="fa-solid fa-trash"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" class="i-desc" placeholder="Description" autocomplete="off">
                    <div class="mobile-suggestions"></div>
                </div>
                <div class="grid-3">
                    <div class="form-group">
                        <label>Qty</label>
                        <input type="number" class="i-qty" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Price</label>
                        <input type="number" class="i-price" placeholder="0.00">
                    </div>
                    <div class="total-display">
                        <small>ITEM TOTAL</small>
                        <span class="i-total">0.00</span>
                    </div>
                </div>
            `;
            itemsContainer.appendChild(div);

            const iCode = div.querySelector('.i-code');
            const iDesc = div.querySelector('.i-desc');
            const iQty = div.querySelector('.i-qty');
            const iPrice = div.querySelector('.i-price');
            
            div.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('focus', function() {
                    if(this.value === '0' || this.value === '0.00') {
                        this.value = '';
                    }
                    if(inp !== iCode && inp !== iDesc) handleMobileFocus(inp);
                });

                inp.addEventListener('dblclick', (e) => {
                    e.target.value = '';
                    if(e.target.classList.contains('i-code')) {
                        iDesc.value = '';
                        iPrice.value = '';
                        e.target.dataset.lastValid = '';
                    }
                    calcRow(div);
                });
            });

            iCode.addEventListener('input', (e) => {
                e.target.value = e.target.value.toUpperCase();
                const val = e.target.value;
                const exact = itemsData.find(i => i.code === val);
                if(exact) {
                    selectItem(exact, iCode);
                } else {
                    if (e.target.dataset.lastValid && val !== e.target.dataset.lastValid) {
                        iDesc.value = '';
                        iPrice.value = '';
                        e.target.dataset.lastValid = '';
                    }
                }
                renderSuggestions(val, 'item', iCode);
                calcTotal();
            });

            iCode.addEventListener('focus', () => {
                handleMobileFocus(iCode);
                renderSuggestions(iCode.value, 'item', iCode);
            });

            iDesc.addEventListener('input', (e) => renderSuggestions(e.target.value, 'item', iDesc));
            iDesc.addEventListener('focus', () => {
                handleMobileFocus(iDesc);
                renderSuggestions(iDesc.value, 'item', iDesc);
            });

            [iQty, iPrice].forEach(inp => {
                inp.addEventListener('input', () => calcRow(div));
            });
        };

        document.getElementById('btnAddRow').addEventListener('click', addItemRow);

        function calcRow(card) {
            const qty = parseFloat(card.querySelector('.i-qty').value) || 0;
            const price = parseFloat(card.querySelector('.i-price').value) || 0;
            const total = qty * price;
            card.querySelector('.i-total').innerText = total.toFixed(2);
            calcTotal();
        }

        window.calcTotal = () => {
            let itemCount = 0, grandTotal = 0;
            document.querySelectorAll('.mobile-item-card').forEach(c => {
                if(c.classList.contains('is-msg')) return;
                const codeVal = c.querySelector('.i-code').value.trim();
                if(codeVal !== '') itemCount++;
                const qty = parseFloat(c.querySelector('.i-qty').value) || 0;
                const price = parseFloat(c.querySelector('.i-price').value) || 0;
                grandTotal += (qty * price);
            });
            document.getElementById('totalQty').innerText = itemCount;
            document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
        };

        // --- SUBMIT PRE-CHECK ---
        let pendingOrderData = null;

        document.getElementById('btnPreSubmit').addEventListener('click', () => {
            const customer = document.getElementById('customerInput').value;
            const rep = document.getElementById('repSelect').value;

            if(!customer || !rep) {
                showAlert("Please select a Customer and Representative");
                return;
            }

            const items = [];
            document.querySelectorAll('.mobile-item-card').forEach(c => {
                if (c.classList.contains('is-msg')) {
                    const msg = c.querySelector('.msg-content').value;
                    if(msg.trim()) {
                        items.push({ code: "MSG", desc: msg, qty: 0, price: 0, total: 0 });
                    }
                } else {
                    const code = c.querySelector('.i-code').value;
                    const qty = c.querySelector('.i-qty').value;
                    if(code) { 
                        items.push({
                            code: code,
                            desc: c.querySelector('.i-desc').value,
                            qty: parseFloat(qty) || 0,
                            price: parseFloat(c.querySelector('.i-price').value) || 0,
                            total: parseFloat(c.querySelector('.i-total').innerText) || 0
                        });
                    }
                }
            });

            if(items.length === 0) {
                showAlert("Please add at least one item or message");
                return;
            }

            pendingOrderData = {
                customer: {
                    name: customer,
                    code: document.getElementById('custCode').value,
                    address: document.getElementById('custAddress').value,
                    mobile: document.getElementById('custMobile').value
                },
                rep: rep,
                items: items,
                grandTotal: parseFloat(document.getElementById('grandTotal').innerText),
                timestamp: serverTimestamp(),
                date: new Date().toISOString().split('T')[0]
            };

            // --- POPULATE PREMIUM SUMMARY ---
            const modal = document.getElementById('summaryModal');
            const psCust = document.getElementById('psCustomer');
            const psList = document.getElementById('psItemsList');
            
            psCust.innerHTML = `
                <div class="ps-c-icon"><i class="fa-solid fa-user-tag"></i></div>
                <div class="ps-c-info">
                    <h4>${pendingOrderData.customer.name}</h4>
                    <p>${pendingOrderData.customer.code} | ${pendingOrderData.customer.address}</p>
                </div>
            `;

            let listHtml = '';
            items.forEach(i => {
                if(i.code === 'MSG') {
                    listHtml += `
                        <div class="ps-item">
                            <div class="ps-i-desc" style="color:var(--neon-blue); font-style:italic; grid-column:1 / -1;">
                                <i class="fa-solid fa-comment-dots"></i> ${i.desc}
                            </div>
                        </div>`;
                } else {
                    listHtml += `
                        <div class="ps-item">
                            <div class="ps-i-desc">
                                ${i.desc} <small>Code: ${i.code}</small>
                            </div>
                            <div class="ps-i-qty">
                                <span class="qty-badge">${i.qty}</span>
                            </div>
                            <div class="ps-i-total">
                                ${i.total.toFixed(2)}
                            </div>
                        </div>
                    `;
                }
            });

            psList.innerHTML = listHtml;
            document.getElementById('psTotal').innerText = pendingOrderData.grandTotal.toFixed(2);
            modal.classList.add('open');
        });

        // --- FINAL SUBMIT ---
        document.getElementById('btnConfirmSubmit').addEventListener('click', async () => {
            const btn = document.getElementById('btnConfirmSubmit');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                // Save to Firestore
                await addDoc(collection(db, "orders"), pendingOrderData);
                
                // Close Summary Modal
                closeModal('summaryModal');

                // Show Custom Success Popup
                const successPopup = document.getElementById('successPopup');
                successPopup.classList.add('show');

                // --- FORCE RESET & RELOAD ---
                // We clear inputs visually first
                resetForm();
                
                setTimeout(() => {
                    location.reload(true); // Hard Reload to clear all browser cache/state
                }, 1500);

            } catch (e) {
                showAlert("Error: " + e.message);
                btn.disabled = false;
                btn.innerText = "CONFIRM & SAVE";
            }
        });

    </script>
</body>
</html>
