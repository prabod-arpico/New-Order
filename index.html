<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Order | Premium Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        :root {
            --primary-glow: #4f46e5; 
            --accent-blue: #0ea5e9;   
            --accent-purple: #8b5cf6; 
            --bg-deep: #030014;       
            
            --glass-surface: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --header-height: 80px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 120px;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(79, 70, 229, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 0% 50%, rgba(14, 165, 233, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 100% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* --- UI HELPERS --- */
        .text-center { text-align: center; }
        
        /* --- STATUS INDICATOR (UPDATED LOGIC) --- */
        #netStatus {
            position: fixed; top: 20px; right: 20px; z-index: 10001;
            width: 14px; height: 14px; border-radius: 50%;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            
            /* Checking State (Yellow) */
            background-color: #f1c40f;
            box-shadow: 0 0 15px #f1c40f;
        }

        #netStatus.online {
            background-color: #22c55e !important;
            box-shadow: 0 0 15px #22c55e !important;
        }
        
        #netStatus.offline {
            background-color: #ef4444 !important;
            box-shadow: 0 0 15px #ef4444 !important;
        }
        
        #pendingBadge {
            position: fixed; top: 20px; right: 45px; z-index: 10001;
            background: var(--accent-purple); color: #fff;
            font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
            font-family: 'Outfit'; font-weight: 700; display: none;
            box-shadow: 0 0 10px rgba(139,92,246,0.5);
            cursor: pointer;
        }

        /* --- NEW TOAST NOTIFICATION (Replaces blocking popup) --- */
        #status-toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--glass-border);
            padding: 12px 24px; border-radius: 50px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20000; min-width: 280px; justify-content: center;
        }
        #status-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-icon { font-size: 1.2rem; }

        /* --- AMBIENT GLOW EFFECTS --- */
        .ambient-orb {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 600px; height: 300px;
            background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
            pointer-events: none; z-index: -1;
            filter: blur(60px);
        }

        /* --- LOADER --- */
        #loader {
            position: fixed; inset: 0; background: var(--bg-deep); z-index: 10000;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }
        .spinner {
            width: 60px; height: 60px; 
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-blue); 
            border-right-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.2);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- HEADER --- */
        header {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 1600px; height: var(--header-height);
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            z-index: 1000; display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .brand {
            font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--accent-blue) 100%);
            -webkit-background-clip: text; color: transparent;
            cursor: pointer; letter-spacing: 1px;
            display: flex; align-items: center; gap: 10px;
        }
        .brand i { color: var(--accent-blue); font-size: 1.2rem; filter: drop-shadow(0 0 10px var(--accent-blue)); }
        
        .date-badge {
            font-family: 'Outfit'; font-weight: 500;
            border: 1px solid rgba(14, 165, 233, 0.3);
            padding: 8px 20px; border-radius: 30px; font-size: 0.85rem;
            color: #fff; background: linear-gradient(90deg, rgba(14,165,233,0.1), transparent);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.1);
            cursor: pointer;
            user-select: none;
        }

        /* --- LAYOUT GRID SYSTEM --- */
        .main-container {
            margin-top: calc(var(--header-height) + 40px);
            padding: 20px;
            max-width: 1600px;
            margin-left: auto; margin-right: auto;
        }

        .desktop-wrapper { 
            position: relative; 
            display: grid;
            grid-template-columns: 1fr; 
            gap: 30px;
        }

        .content-area { width: 100%; }

        /* --- SIDEBAR SUGGESTIONS (DESKTOP) --- */
        #desktopSuggestionsPanel {
            background: rgba(10, 10, 20, 0.6); 
            border: 1px solid var(--glass-border);
            border-left: 1px solid var(--accent-blue);
            border-radius: 20px; backdrop-filter: blur(30px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; overflow: hidden;
            
            height: fit-content;
            max-height: calc(100vh - 150px);
            position: sticky;
            top: 130px;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            padding: 20px; background: linear-gradient(to right, rgba(14,165,233,0.1), transparent);
            border-bottom: 1px solid var(--glass-border); color: #fff;
            font-weight: 600; letter-spacing: 1px; font-size: 0.9rem;
        }
        #desktopSuggestionsContent { flex: 1; overflow-y: auto; padding: 10px; min-height: 100px; }

        /* --- GLASS CARDS --- */
        .glass-card {
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-radius: 24px; 
            padding: 35px; margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4); 
            position: relative; overflow: visible; 
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card::before {
            content:''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(14,165,233,0.03), transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .glass-card > * { position: relative; z-index: 1; }

        h2 { 
            font-family: 'Outfit'; font-weight: 600; margin-bottom: 25px; 
            color: #fff; display: flex; align-items: center; gap: 12px; font-size: 1.3rem; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        h2 i { 
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; color: transparent;
        }

        /* --- INPUTS --- */
        .form-group { margin-bottom: 25px; position: relative; }
        
        #group-cust { z-index: 1000 !important; }

        label { 
            display: block; font-size: 0.7rem; color: var(--text-muted); 
            margin-bottom: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; 
            padding-left: 5px;
        }
        
        input, select, textarea {
            width: 100%; padding: 16px 20px;
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; color: #fff; font-size: 1rem; font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .uppercase-input { text-transform: uppercase; letter-spacing: 1px; }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent-blue); 
            background: rgba(14, 165, 233, 0.05);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.2), inset 0 2px 4px rgba(0,0,0,0.3);
            transform: translateY(-1px);
        }
        textarea { resize: vertical; min-height: 100px; }

        .premium-select { position: relative; }
        .premium-select select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 45px; }
        .premium-select::after {
            content: '\f078'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            color: var(--accent-blue); pointer-events: none; font-size: 0.8rem;
        }
        .premium-select option { background: #0f172a; color: #fff; padding: 15px; }

        /* --- MOBILE ITEM CARDS --- */
        .mobile-item-card {
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px; padding: 20px; margin-bottom: 20px; position: relative;
            transition: all 0.3s ease;
        }
        .mobile-item-card.focused { 
            border-color: var(--accent-blue); 
            box-shadow: 0 0 25px rgba(14,165,233,0.15); 
            background: rgba(14,165,233,0.02); 
        }
        .mobile-item-card.is-msg { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.05); }

        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-del {
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444; width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-del:hover { background: rgba(239, 68, 68, 0.2); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .total-display { 
            text-align: center; color: var(--accent-blue); 
            font-family: 'Outfit'; font-weight: 700; 
            display: flex; flex-direction: column; justify-content: center; height: 100%; 
            background: rgba(14,165,233,0.05); border-radius: 12px; border: 1px dashed rgba(14,165,233,0.3);
        }

        /* --- SUGGESTIONS (MOBILE & GLOBAL) --- */
        .mobile-suggestions {
            background-color: #000000 !important; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            border-radius: 0 0 12px 12px; 
            max-height: 250px; overflow-y: auto;
            display: none; 
            margin-top: -5px; 
            z-index: 9999 !important;
            box-shadow: 0 15px 40px rgba(0,0,0,1) !important;
        }
        
        .suggestion-item { 
            background-color: #000000;
            padding: 15px 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .suggestion-item:hover { background-color: #1e1b4b !important; }
        
        .s-main { font-weight: 600; color: #fff; font-size: 0.95rem; margin-bottom: 4px; }
        .s-sub { font-size: 0.75rem; color: #94a3b8; display: flex; justify-content: space-between; }

        .btn-add {
            width: 100%; padding: 18px; margin-top: 15px;
            background: rgba(14,165,233,0.05); 
            border: 1px dashed var(--accent-blue);
            color: var(--accent-blue); border-radius: 14px; 
            font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.3s;
        }
        .btn-add:hover { background: rgba(14,165,233,0.15); box-shadow: 0 0 20px rgba(14,165,233,0.1); transform: translateY(-2px); }

        /* --- FOOTER --- */
        .action-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 1400px;
            background: rgba(10, 10, 25, 0.85); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight);
            border-radius: 20px; padding: 15px 30px; z-index: 1000;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .action-inner { display: flex; align-items: center; justify-content: space-between; }
        
        .footer-totals { display: flex; gap: 40px; align-items: center; }
        .f-item small { display: block; font-size: 0.65rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1.5px; margin-bottom: 4px; }
        .f-item span { 
            font-family: 'Outfit'; font-size: 1.5rem; font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--accent-blue)); -webkit-background-clip: text; color: transparent;
        }

        .footer-btns { display: flex; gap: 15px; }
        .btn { 
            padding: 14px 35px; border-radius: 50px; border: none; 
            font-weight: 600; cursor: pointer; font-size: 0.95rem; 
            transition: all 0.3s ease; font-family: 'Outfit';
        }
        .btn:active { transform: scale(0.96); }
        .btn-submit { 
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-blue)); 
            color: white; 
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-cancel { background: rgba(255, 255, 255, 0.05); color: #ccc; border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-ok { 
            background: linear-gradient(135deg, var(--accent-blue), #2563eb); 
            color: #fff; box-shadow: 0 0 20px rgba(14,165,233,0.4); 
        }

        /* --- MODAL SYSTEM --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px); z-index: 9999;
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.open { display: flex; opacity: 1; }
        
        .modal-content {
            background: linear-gradient(160deg, #1e1b4b, #020617);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--accent-blue);
            border-radius: 24px; width: 90%; max-width: 550px;
            padding: 0; 
            box-shadow: 0 0 80px rgba(79, 70, 229, 0.25);
            transform: scale(0.95); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column;
        }
        .modal-overlay.open .modal-content { transform: scale(1); }
        
        /* PREMIUM SUMMARY */
        .ps-header { padding: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .ps-header h3 { font-family: 'Outfit'; color: #fff; margin: 0; font-size: 1.4rem; letter-spacing: 1px; }
        .ps-header small { color: var(--accent-blue); font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
        .ps-body { padding: 25px; overflow-y: auto; }
        .ps-customer-card {
            background: rgba(14, 165, 233, 0.08); border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 16px; padding: 20px; margin-bottom: 25px;
            display: flex; gap: 20px; align-items: center;
        }
        .ps-c-icon { 
            width: 50px; height: 50px; background: rgba(14,165,233,0.15); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; color: var(--accent-blue);
            font-size: 1.2rem;
        }
        .ps-c-info h4 { color: #fff; font-size: 1.1rem; margin-bottom: 4px; font-weight: 600; }
        .ps-c-info p { color: #cbd5e1; font-size: 0.85rem; margin: 0; opacity: 0.8; }
        .ps-table-head {
            display: grid; grid-template-columns: 2fr 1fr 1fr;
            font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase;
            padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px;
        }
        .ps-item {
            display: grid; grid-template-columns: 2fr 1fr 1fr; align-items: center;
            padding: 12px 0; border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .ps-i-desc { color: #f1f5f9; font-weight: 500; font-size: 0.95rem; line-height: 1.3; }
        .ps-i-desc small { display: block; color: #64748b; font-size: 0.75rem; margin-top: 3px; font-family: monospace; }
        .qty-badge {
            background: rgba(79, 70, 229, 0.2); color: #a5b4fc;
            border: 1px solid rgba(79, 70, 229, 0.3); padding: 4px 12px;
            border-radius: 20px; font-weight: 700; font-size: 0.8rem; min-width: 40px; text-align: center;
            margin: 0 auto; display: block; width: fit-content;
        }
        .ps-i-total { text-align: right; color: #fff; font-weight: 600; font-family: 'Outfit'; }
        .ps-footer { padding: 25px; background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.1); }
        .ps-total-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; }
        .ps-total-val { font-family: 'Outfit'; font-weight: 700; font-size: 2rem; color: var(--accent-blue); line-height: 1; text-shadow: 0 0 30px rgba(14,165,233,0.4); }
        .ps-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* Warning/Error Modal (Red) */
        .modal-content.warning { 
            border-color: #ef4444; box-shadow: 0 0 50px rgba(239, 68, 68, 0.2); 
            text-align: center; padding: 40px;
        }
        .warning-icon { font-size: 3.5rem; color: #ef4444; margin-bottom: 20px; text-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .warning-title { color: #ef4444; font-family:'Outfit'; margin-bottom:10px; text-align: center; width: 100%; display: block; }
        .warning-text { color: #cbd5e1; margin-bottom: 25px; font-size: 1.1rem; text-align: center; }

        /* --- REDESIGNED HISTORY CARD (NEW) --- */
        .history-card {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .h-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px;
        }
        .h-cust-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 1.1rem;
            color: var(--accent-blue);
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .h-meta-date { color: #94a3b8; font-size: 0.8rem; text-align: right; }
        .h-meta-total { 
            color: #fff; font-weight: 700; font-size: 1.2rem; 
            font-family: 'Outfit', sans-serif; text-align: right;
        }
        .status-badge {
            background: rgba(34, 197, 94, 0.15); 
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80; 
            font-size: 0.65rem; font-weight: 700;
            padding: 4px 10px; border-radius: 6px;
            display: inline-block; letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .status-badge.pending {
            background: rgba(139, 92, 246, 0.15); 
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #c4b5fd;
        }

        .h-items-preview {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .h-item-row {
            display: flex; justify-content: space-between;
            font-size: 0.9rem; color: #cbd5e1;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .h-item-row:last-child { border-bottom: none; }
        .h-item-qty {
            background: rgba(139, 92, 246, 0.2); color: #c4b5fd;
            padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 0.75rem;
        }
        .h-actions {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }
        .btn-h-del {
            background: transparent; border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8; border-radius: 8px; padding: 10px;
            font-size: 0.8rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-h-del:hover { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        
        .btn-h-mod {
            background: transparent; border: 1px solid var(--accent-blue);
            color: var(--accent-blue); border-radius: 8px; padding: 10px;
            font-size: 0.8rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-h-mod:hover { background: rgba(14, 165, 233, 0.15); box-shadow: 0 0 15px rgba(14, 165, 233, 0.2); }

        /* --- MEDIA QUERIES --- */
        @media (min-width: 1024px) {
            .desktop-wrapper {
                grid-template-columns: 1fr 350px; 
                gap: 40px;
                align-items: start;
            }
            #desktopSuggestionsPanel { display: flex !important; transform: none !important; }
            .mobile-suggestions { display: none !important; }
            .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        }

        @media (max-width: 1023px) {
            #desktopSuggestionsPanel { display: none !important; }
            .main-container { padding: 15px; padding-bottom: 150px; margin-top: 100px; }
            .glass-card { padding: 20px; }
            header { width: 100%; top: 0; border-radius: 0; border-top: none; border-left: none; border-right: none; }
            .action-bar { width: 100%; bottom: 0; border-radius: 0; border-bottom: none; }
        }
    </style>
</head>
<body>
    <div class="ambient-orb"></div> 
    
    <div id="netStatus" title="Checking Connection..."></div>
    
    <div id="pendingBadge">0 Sync Pending</div>

    <div id="status-toast">
        <i class="toast-icon fas fa-info-circle"></i>
        <span id="toast-message">Notification</span>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loaderText" style="margin-top: 25px; color: var(--text-main); font-family: 'Outfit'; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase;">Initializing System</div>
    </div>

    <div id="alertModal" class="modal-overlay">
        <div class="modal-content warning">
            <div class="warning-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <h2 class="warning-title">ATTENTION</h2>
            <p id="alertMessage" class="warning-text"></p>
            <button class="btn btn-cancel" onclick="closeModal('alertModal')" style="width:100%; border-color:#ef4444; color:#ef4444;">ACKNOWLEDGE</button>
        </div>
    </div>

    <div id="summaryModal" class="modal-overlay">
        <div class="modal-content">
            <div class="ps-header">
                <h3>INVOICE PREVIEW</h3>
                <small>Verify Order Details</small>
            </div>
            
            <div class="ps-body">
                <div id="psCustomer" class="ps-customer-card"></div>
                <div class="ps-table-head">
                    <div>Description</div>
                    <div style="text-align:center">Qty</div>
                    <div style="text-align:right">Amount</div>
                </div>
                <div id="psItemsList"></div>
            </div>

            <div class="ps-footer">
                <div class="ps-total-row">
                    <span>Grand Total</span>
                    <span class="ps-total-val" id="psTotal">0.00</span>
                </div>
                <div class="ps-actions">
                    <button class="btn btn-cancel" onclick="closeModal('summaryModal')">MODIFY</button>
                    <button class="btn btn-ok" id="btnConfirmSubmit">CONFIRM & SAVE</button>

    <div id="historyModal" class="modal-overlay">
        <div class="modal-content" style="max-width:600px; padding:20px; background: #0b0f19;">
            <div id="historyModalTitle" class="modal-header" style="text-align:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:15px; margin-bottom:15px; font-family:'Outfit'; color:var(--accent-blue); font-size:1.2rem; font-weight:700;">
                ORDER HISTORY
            </div>
            <div id="historyContent">Loading...</div>
            <div class="modal-actions" style="margin-top: 20px;">
                <button class="btn btn-cancel" onclick="closeModal('historyModal')" style="width:100%">CLOSE PANEL</button>
            </div>
        </div>
    </div>

    <header>
        <div class="brand" ondblclick="location.reload()" title="Double Tap to Reset">
            <i class="fa-solid fa-cube"></i> NEW ORDER
        </div>
        <div class="date-badge" id="currentDate" ondblclick="showPendingOrders()" title="Double Tap to View Pending"></div>
    </header>

    <div class="main-container">
        <div class="desktop-wrapper">
            
            <div class="content-area">
                
                <div class="glass-card">
                    <h2><i class="fa-solid fa-user-astronaut"></i> Customer Profile</h2>
                    
                    <div class="grid-2">
                        <div class="form-group" id="group-cust">
                            <label>Customer Name / Search</label>
                            <input type="text" id="customerInput" placeholder="Type name or code..." autocomplete="off">
                            <div class="mobile-suggestions" id="mobile-cust-suggestions"></div>
                        </div>
                        
                        <div class="form-group">
                            <label>Customer Code</label>
                            <input type="text" id="custCode" style="color:var(--accent-blue); font-weight:600;" autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="custAddress" autocomplete="off">
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Mobile Contact</label>
                            <input type="text" id="custMobile" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label>Sales Representative</label>
                            <div class="premium-select">
                                <select id="repSelect">
                                    <option value="">Select Representative...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass-card">
                    <h2><i class="fa-solid fa-layer-group"></i> Order Items</h2>
                    <div id="itemsContainer"></div>
                    <button class="btn-add" id="btnAddRow">
                        <i class="fa-solid fa-circle-plus"></i> ADD NEW LINE
                    </button>
                </div>

            </div>

            <aside id="desktopSuggestionsPanel">
                <div class="sidebar-header">
                    <span><i class="fa-solid fa-bolt"></i> SMART SUGGESTIONS</span>
                </div>
                <div id="desktopSuggestionsContent"></div>
            </aside>

        </div>
    </div>

    <div class="action-bar">
        <div class="action-inner">
            <div class="footer-totals">
                <div class="f-item">
                    <small>TOTAL ITEMS</small>
                    <span id="totalQty">0</span>
                </div>
                <div class="f-item">
                    <small>GRAND TOTAL</small>
                    <span id="grandTotal">0.00</span>
                </div>
            </div>
            <div class="footer-btns">
                <button class="btn btn-submit" id="btnPreSubmit">SUBMIT ORDER</button>
            </div>
        </div>
    </div>

    <script type="module">
        // --- SERVICE WORKER REGISTRATION ---
        const OFFLINE_KEY = "offlineOrdersQueue";

        function getOfflineOrders(){
            return JSON.parse(localStorage.getItem(OFFLINE_KEY) || "[]");
        }

        function setOfflineOrders(arr){
            localStorage.setItem(OFFLINE_KEY, JSON.stringify(arr));
        }

        function pushOfflineOrder(order){
            const q = getOfflineOrders();
            q.push(order);
            setOfflineOrders(q);
            updatePendingBadge();
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('SW registered:', registration.scope);
                }).catch(err => {
                    console.log('SW registration failed:', err);
                });
            });
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp, query, orderBy, limit, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyA5o9ttyPpOmRu0zVSUJ6g3H1mf05FkgW4",
            authDomain: "reps-a1259.firebaseapp.com",
            databaseURL: "https://reps-a1259-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "reps-a1259",
            storageBucket: "reps-a1259.firebasestorage.app",
            messagingSenderId: "537453276765",
            appId: "1:537453276765:web:53ebf8674f1bd36a04e7b4",
            measurementId: "G-1S0ME1X96X"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        // STATE
        let customersData = [];
        let itemsData = [];
        const isMobile = () => window.innerWidth < 1024; 

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString();

        // --- NEW TOAST SYSTEM ---
        function showToast(message, type = 'info') {
            const toast = document.getElementById('status-toast');
            const msgSpan = document.getElementById('toast-message');
            const icon = toast.querySelector('.toast-icon');

            msgSpan.innerText = message;
            toast.className = ''; // Reset classes
            toast.classList.add('show');

            if(type === 'success') {
                toast.style.borderLeft = "4px solid #22c55e";
                icon.className = 'toast-icon fas fa-check-circle';
                icon.style.color = '#22c55e';
            }
            else if(type === 'offline') {
                toast.style.borderLeft = "4px solid #ef4444";
                icon.className = 'toast-icon fas fa-wifi';
                icon.style.color = '#ef4444';
            }
            else if(type === 'sync') {
                 toast.style.borderLeft = "4px solid #8b5cf6";
                 icon.className = 'toast-icon fas fa-sync fa-spin';
                 icon.style.color = '#8b5cf6';
            }

            // Hide after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // --- REAL-TIME NETWORK DETECTOR (GOOGLE DNS PING) ---
        let isOnline = false;

        async function checkRealInternetConnection() {
            try {
                // Ping Google DNS
                const response = await fetch('https://dns.google/resolve?name=google.com', {
                    method: 'GET',
                    cache: 'no-cache',
                });
                
                if (response.ok) {
                    if(!isOnline) {
                        // We just reconnected
                        showToast("Connection Restored. Syncing...", "sync");
                        processOfflineQueue();
                    }
                    setOnlineStatus(true);
                } else {
                    setOnlineStatus(false);
                }
            } catch (error) {
                setOnlineStatus(false);
            }
        }

        function setOnlineStatus(online) {
            isOnline = online;
            const statusEl = document.getElementById('netStatus');
            if(online) {
                statusEl.className = 'online';
                statusEl.title = "Online";
            } else {
                statusEl.className = 'offline';
                statusEl.title = "Offline";
            }
        }

        // --- GLOBAL CLICK LISTENER: CLOSE SUGGESTIONS ---
        document.addEventListener('click', function(event) {
            const target = event.target;
            const isInput = target.tagName === 'INPUT';
            const isSuggestionBox = target.closest('.mobile-suggestions');
            
            if (!isInput && !isSuggestionBox) {
                document.querySelectorAll('.mobile-suggestions').forEach(el => {
                    el.style.display = 'none';
                });
            }
        });

        // --- RESET FORM ---
        function resetForm() {
            document.querySelectorAll('input').forEach(i => i.value = '');
            const repSel = document.getElementById('repSelect');
            if(repSel) repSel.selectedIndex = 0;
            const savedRep = localStorage.getItem('lastRep');
            if(savedRep && repSel) repSel.value = savedRep;
            document.getElementById('itemsContainer').innerHTML = ''; 
            document.getElementById('totalQty').innerText = '0';
            document.getElementById('grandTotal').innerText = '0.00';
            addItemRow(); 
            updatePendingBadge();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- UI UTILS ---
        window.closeModal = (id) => {
            document.getElementById(id).classList.remove('open');
        };

        window.showAlert = (msg) => {
            document.getElementById('alertMessage').innerText = msg;
            document.getElementById('alertModal').classList.add('open');
        };

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('open');
                }
            });
        });

        // --- PENDING ORDERS LOGIC (LOCAL STORAGE) ---
        window.showPendingOrders = () => {
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('historyContent');
            const title = document.getElementById('historyModalTitle');
            
            modal.classList.add('open');
            title.innerText = "PENDING UPLOADS (OFFLINE)";
            
            const queue = getOfflineOrders();
            
            if (queue.length === 0) {
                content.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">No pending orders in local storage.</div>';
                return;
            }

            let html = '';
            queue.forEach((data, index) => {
                const date = data.date || 'N/A';
                const itemsStr = data.items.map(i => {
                    if(i.code === 'MSG') return `<div class="h-item-row"><span style="color:var(--accent-purple); font-style:italic;">${i.desc}</span></div>`;
                    return `<div class="h-item-row"><span>${i.desc}</span><span class="h-item-qty">X ${i.qty}</span></div>`;
                }).join('');

                html += `
                    <div class="history-card" style="border-color:var(--accent-purple)">
                        <div class="h-header">
                            <div>
                                <div class="h-cust-name">${data.customer.name}</div>
                                <div class="status-badge pending">WAITING SYNC</div>
                            </div>
                            <div>
                                <div class="h-meta-date">${date}</div>
                                <div class="h-meta-total">${data.grandTotal.toFixed(2)}</div>
                            </div>
                        </div>
                        <div class="h-items-preview">${itemsStr}</div>
                        <div class="h-actions">
                            <button class="btn-h-del" onclick="deletePendingOrder(${index})">
                                <i class="fa-solid fa-trash"></i> DELETE
                            </button>
                            <button class="btn-h-mod" onclick="syncPending()">
                                <i class="fa-solid fa-rotate"></i> FORCE SYNC
                            </button>
                        </div>
                    </div>
                `;
            });
            content.innerHTML = html;
        };

        window.deletePendingOrder = (index) => {
            if(!confirm("Delete this offline order?")) return;
            const queue = getOfflineOrders();
            queue.splice(index, 1);
            setOfflineOrders(queue);
            showPendingOrders(); // Refresh view
            updatePendingBadge();
        };

        window.syncPending = () => {
            if(!isOnline) {
                showAlert("Still offline. Cannot sync.");
                return;
            }
            closeModal('historyModal');
            processOfflineQueue();
        };


        // --- HISTORY LOGIC (FIREBASE) ---
        let loadedHistoryOrders = []; 

        window.fetchHistory = async () => {
            if(!isOnline) {
                showAlert("History is only available when online.");
                return;
            }
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('historyContent');
            const title = document.getElementById('historyModalTitle');
            
            modal.classList.add('open');
            title.innerText = "ORDER HISTORY (ONLINE)";
            content.innerHTML = '<div style="text-align:center"><div class="spinner"></div><br>Fetching Records...</div>';

            try {
                const q = query(collection(db, "orders"), orderBy("timestamp", "desc"), limit(10));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    content.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">No history available.</div>';
                    return;
                }

                loadedHistoryOrders = [];
                let html = '';
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    loadedHistoryOrders.push({ id: docId, ...data });
                    
                    const date = data.date || 'N/A';
                    
                    const itemsStr = data.items.map(i => {
                        if(i.code === 'MSG') return `<div class="h-item-row"><span style="color:var(--accent-purple); font-style:italic;">${i.desc}</span></div>`;
                        return `
                            <div class="h-item-row">
                                <span>${i.desc}</span>
                                <span class="h-item-qty">X ${i.qty}</span>
                            </div>
                        `;
                    }).join('');

                    html += `
                        <div class="history-card" id="card-${docId}">
                            <div class="h-header">
                                <div>
                                    <div class="h-cust-name">${data.customer.name}</div>
                                    <div class="status-badge">UPLOADED</div>
                                </div>
                                <div>
                                    <div class="h-meta-date">${date}</div>
                                    <div class="h-meta-total">${data.grandTotal.toFixed(2)}</div>
                                </div>
                            </div>
                            
                            <div class="h-items-preview">
                                ${itemsStr}
                            </div>

                            <div class="h-actions">
                                <button class="btn-h-del" onclick="deleteOrder('${docId}')">
                                    <i class="fa-solid fa-trash"></i> DELETE
                                </button>
                                <button class="btn-h-mod" onclick="modifyOrder('${docId}')">
                                    <i class="fa-solid fa-pen-to-square"></i> MODIFY / RE-ORDER
                                </button>
                            </div>
                        </div>
                    `;
                });
                content.innerHTML = html;
            } catch (e) {
                content.innerHTML = `<div style="text-align:center; color:#ef4444;">Error loading history: ${e.message}</div>`;
            }
        };

        // --- DELETE ORDER ---
        window.deleteOrder = async (docId) => {
            if(!confirm("Are you sure you want to delete this order permanently?")) return;
            
            const card = document.getElementById(`card-${docId}`);
            if(card) card.style.opacity = '0.5';

            try {
                await deleteDoc(doc(db, "orders", docId));
                if(card) card.remove();
                if(document.querySelectorAll('.history-card').length === 0) {
                    document.getElementById('historyContent').innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">No history available.</div>';
                }
            } catch (e) {
                alert("Failed to delete: " + e.message);
                if(card) card.style.opacity = '1';
            }
        };

        // --- MODIFY ORDER ---
        window.modifyOrder = (docId) => {
            const order = loadedHistoryOrders.find(o => o.id === docId);
            if(!order) return;

            closeModal('historyModal');

            document.getElementById('customerInput').value = order.customer.name;
            document.getElementById('custCode').value = order.customer.code;
            document.getElementById('custAddress').value = order.customer.address;
            document.getElementById('custMobile').value = order.customer.mobile;
            
            const repSel = document.getElementById('repSelect');
            if(repSel) repSel.value = order.rep;

            document.getElementById('itemsContainer').innerHTML = '';

            order.items.forEach(item => {
                if(item.code === 'MSG') {
                    addItemRow();
                    const lastRow = document.querySelector('#itemsContainer').lastElementChild;
                    const input = lastRow.querySelector('.i-code');
                    transformToMsgBox(input);
                    const ta = lastRow.querySelector('textarea');
                    if(ta) ta.value = item.desc;

                } else {
                    addItemRow();
                    const lastRow = document.querySelector('#itemsContainer').lastElementChild;
                    const inputs = lastRow.querySelectorAll('input');
                    inputs[0].value = item.code;
                    inputs[1].value = item.desc;
                    inputs[2].value = item.qty;
                    inputs[3].value = item.price;
                    lastRow.querySelector('.i-total').innerText = item.total.toFixed(2);
                }
            });
            calcTotal();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function transformToMsgBox(inputEl) {
            const card = inputEl.closest('.mobile-item-card');
            card.classList.add('is-msg');
            card.innerHTML = `
                <div class="item-header">
                    <div style="flex:1; color: var(--accent-purple); font-weight:bold;">
                        <i class="fa-solid fa-comment-dots"></i> SPECIAL MESSAGE
                    </div>
                    <div onclick="this.closest('.mobile-item-card').remove(); calcTotal();" class="btn-del">
                        <i class="fa-solid fa-trash"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Message Content</label>
                    <textarea class="msg-content" placeholder="Type your message here..."></textarea>
                </div>
            `;
            setTimeout(() => {
                const ta = card.querySelector('textarea');
                if(ta) ta.focus();
            }, 100);
            calcTotal();
        }

        // --- DATA LOADING ---
        async function loadData() {
            const cachedCust = localStorage.getItem('db_customers');
            const cachedItems = localStorage.getItem('db_items');
            const cachedReps = localStorage.getItem('db_reps');

            if(cachedCust && cachedItems) {
                customersData = JSON.parse(cachedCust);
                itemsData = JSON.parse(cachedItems);
                populateReps(cachedReps ? JSON.parse(cachedReps) : []);
                document.getElementById('loader').style.display = 'none';
                resetForm();
            }

            // Perform an initial network check before trying to download
            await checkRealInternetConnection();

            if(isOnline) {
                try {
                    const snap = await get(child(ref(rtdb), "encryption_keys"));
                    if(!snap.exists()) throw new Error("Key fetch failed");
                    const keys = snap.val();
                    
                    const keyHex = CryptoJS.enc.Hex.parse(keys.itemsKey || keys.key);
                    const itemsIv = keys.itemsIv || keys.iv; 
                    const ivHex = CryptoJS.enc.Hex.parse(itemsIv);

                    const decrypt = async (file) => {
                        const res = await fetch(`https://raw.githubusercontent.com/prabod-arpico/New-Order/refs/heads/main/database/${file}`);
                        const buff = await res.arrayBuffer();
                        const wa = CryptoJS.lib.WordArray.create(buff);
                        const dec = CryptoJS.AES.decrypt(
                            { ciphertext: wa }, keyHex, 
                            { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
                        );
                        return JSON.parse(dec.toString(CryptoJS.enc.Utf8));
                    };

                    const [rawCust, rawItm, rawReps] = await Promise.all([
                        decrypt("Customer.json.enc"),
                        decrypt("Items.json.enc"),
                        getDocs(collection(db, "reps"))
                    ]);

                    customersData = normalize(rawCust, 'customer');
                    itemsData = normalize(rawItm, 'item');
                    
                    const repList = [];
                    rawReps.forEach(d => repList.push(d.data().name));
                    
                    localStorage.setItem('db_customers', JSON.stringify(customersData));
                    localStorage.setItem('db_items', JSON.stringify(itemsData));
                    localStorage.setItem('db_reps', JSON.stringify(repList));

                    populateReps(repList);

                    document.getElementById('loader').style.display = 'none';
                    if(!cachedCust) resetForm();

                } catch (e) {
                    console.error("Online fetch failed, relying on cache", e);
                    if(!cachedCust) {
                        showAlert("Error loading data (Offline and no cache): " + e.message);
                        document.getElementById('loader').style.display = 'none';
                    }
                }
            } else if (!cachedCust) {
                 document.getElementById('loaderText').innerText = "OFFLINE - NO DATA CACHED";
                 showAlert("You are offline. Please connect once to download data.");
            }
        }

        function populateReps(repsArr) {
            const repSel = document.getElementById('repSelect');
            repSel.innerHTML = '<option value="">Select Representative...</option>';
            repsArr.sort().forEach(r => {
                const opt = document.createElement('option');
                opt.value = opt.text = r;
                repSel.appendChild(opt);
            });
        }

        function normalize(data, type) {
            if(!Array.isArray(data)) return [];
            return data.map(item => {
                const k = Object.keys(item);
                if(type === 'customer') {
                    return {
                        name: item[k.find(x => /name/i.test(x)) || 'name'] || '',
                        code: item[k.find(x => /code/i.test(x)) || 'code'] || '',
                        address: item[k.find(x => /address/i.test(x)) || 'address'] || '',
                        mobile: item[k.find(x => /mobile|phone/i.test(x)) || 'mobile'] || ''
                    };
                } else {
                    return {
                        code: item[k.find(x => /code/i.test(x)) || 'code'] || '',
                        desc: item[k.find(x => /desc/i.test(x)) || 'description'] || '',
                        price: parseFloat(item[k.find(x => /price|rate/i.test(x)) || 'price']) || 0
                    };
                }
            });
        }

        // --- KEY LISTENERS ---
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') {
                const current = e.target;
                if(current.id === 'custCode' && current.value.trim().toLowerCase() === 'save') {
                    e.preventDefault(); current.value = ''; fetchHistory(); return;
                }
                e.preventDefault();
                if(current.classList.contains('i-code') && current.value.toLowerCase() === 'mg') {
                    transformToMsgBox(current); return;
                }
                const focusable = Array.from(document.querySelectorAll('input:not([type=hidden]):not([disabled]), select, textarea'));
                const index = focusable.indexOf(current);
                if (index > -1 && index < focusable.length - 1) {
                    const next = focusable[index + 1]; next.focus();
                    if (next.value === '0.00' || next.value === '0') next.value = '';
                } else {
                    const lastCard = document.querySelector('#itemsContainer').lastElementChild;
                    if (lastCard && lastCard.contains(current) && current.classList.contains('i-price')) {
                        addItemRow();
                        setTimeout(() => {
                            const newLast = document.querySelector('#itemsContainer').lastElementChild;
                            const newCode = newLast.querySelector('.i-code');
                            if(newCode) newCode.focus();
                        }, 50);
                    }
                }
            }
        });

        // --- UI LOGIC ---
        function handleMobileFocus(element) {
            if(!isMobile()) return;
            setTimeout(() => {
                const headerOffset = 90;
                const elementPosition = element.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                window.scrollTo({ top: offsetPosition, behavior: "smooth" });
                const card = element.closest('.mobile-item-card');
                if(card) {
                    document.querySelectorAll('.mobile-item-card').forEach(c => c.classList.remove('focused'));
                    card.classList.add('focused');
                }
            }, 300);
        }

        function toggleDesktopPanel(htmlContent) {
            const content = document.getElementById('desktopSuggestionsContent');
            if(content) content.innerHTML = htmlContent;
        }

        // Search Handlers
        const custInput = document.getElementById('customerInput');
        custInput.addEventListener('dblclick', () => {
            custInput.value = ''; document.getElementById('custCode').value = '';
            document.getElementById('custAddress').value = ''; document.getElementById('custMobile').value = '';
        });
        custInput.addEventListener('focus', () => {
            handleMobileFocus(custInput); renderSuggestions(custInput.value, 'customer');
        });
        custInput.addEventListener('input', (e) => {
            const val = e.target.value;
            const exact = customersData.find(c => c.code.toLowerCase() === val.toLowerCase() || c.name.toLowerCase() === val.toLowerCase());
            if(exact) selectCustomer(exact);
            renderSuggestions(val, 'customer');
        });

        function renderSuggestions(query, type, contextEl = null) {
            let matches = [];
            const q = query.toLowerCase();
            if (type === 'customer') {
                matches = customersData.filter(c => c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q)).slice(0, 20);
            } else {
                matches = itemsData.filter(i => i.code.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)).slice(0, 20);
            }

            const html = matches.length ? matches.map(m => {
                if (type === 'customer') {
                    return `<div class="suggestion-item"><div class="s-main">${m.name}</div><div class="s-sub"><span>${m.address}</span><span>${m.code}</span></div></div>`;
                } else {
                    return `<div class="suggestion-item"><div class="s-main">${m.code} <br> ↪ ${m.desc} </div></div>`;
                }
            }).join('') : '<div style="padding:20px; text-align:center; color:#64748b;">No matches found</div>';

            const attachListeners = (container) => {
                container.querySelectorAll('.suggestion-item').forEach((el, idx) => {
                    el.addEventListener('click', () => {
                        if(type === 'customer') selectCustomer(matches[idx]);
                        else selectItem(matches[idx], contextEl);
                        
                        if(container.classList.contains('mobile-suggestions')) {
                            container.style.display = 'none';
                        }
                    });
                });
            };

            if (isMobile()) {
                const target = type === 'customer' ? document.getElementById('mobile-cust-suggestions') : contextEl.parentNode.querySelector('.mobile-suggestions');
                target.innerHTML = html; target.style.display = matches.length ? 'block' : 'none';
                attachListeners(target);
            } else {
                toggleDesktopPanel(html);
                attachListeners(document.getElementById('desktopSuggestionsContent'));
            }
        }

        window.selectCustomer = (c) => {
            if(typeof c === 'string') c = customersData.find(x => x.code === c);
            if(!c) return;
            document.getElementById('customerInput').value = c.name;
            document.getElementById('custCode').value = c.code;
            document.getElementById('custAddress').value = c.address;
            document.getElementById('custMobile').value = c.mobile;
        };

        window.selectItem = (item, inputElement) => {
            const card = inputElement.closest('.mobile-item-card');
            const inputs = card.querySelectorAll('input');
            inputs[0].value = item.code; inputs[1].value = item.desc; inputs[3].value = item.price.toFixed(2);
            inputs[0].dataset.lastValid = item.code;
            calcRow(card);
            inputs[2].focus(); if(inputs[2].value === '0') inputs[2].value = '';
        };

        const itemsContainer = document.getElementById('itemsContainer');
        window.addItemRow = () => {
            const div = document.createElement('div');
            div.className = 'mobile-item-card fade-in';
            div.innerHTML = `
                <div class="item-header">
                    <div style="flex:1">
                        <label>Item Code</label>
                        <input type="text" class="i-code uppercase-input" placeholder="Search" autocomplete="off">
                        <div class="mobile-suggestions"></div>
                    </div>
                    <div onclick="this.closest('.mobile-item-card').remove(); calcTotal();" class="btn-del"><i class="fa-solid fa-trash"></i></div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" class="i-desc" placeholder="Description" autocomplete="off">
                    <div class="mobile-suggestions"></div>
                </div>
                <div class="grid-3">
                    <div class="form-group"><label>Qty</label><input type="number" class="i-qty" placeholder="0"></div>
                    <div class="form-group"><label>Price</label><input type="number" class="i-price" placeholder="0.00"></div>
                    <div class="total-display"><small>TOTAL</small><span class="i-total">0.00</span></div>
                </div>
            `;
            itemsContainer.appendChild(div);

            const iCode = div.querySelector('.i-code');
            const iDesc = div.querySelector('.i-desc');
            const iQty = div.querySelector('.i-qty');
            const iPrice = div.querySelector('.i-price');
            
            div.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('focus', function() {
                    if(this.value === '0' || this.value === '0.00') this.value = '';
                    if(inp !== iCode && inp !== iDesc) handleMobileFocus(inp);
                });
                inp.addEventListener('dblclick', (e) => {
                    e.target.value = '';
                    if(e.target.classList.contains('i-code')) { iDesc.value = ''; iPrice.value = ''; e.target.dataset.lastValid = ''; }
                    calcRow(div);
                });
            });

            iCode.addEventListener('input', (e) => {
                e.target.value = e.target.value.toUpperCase();
                const val = e.target.value;
                const exact = itemsData.find(i => i.code === val);
                if(exact) selectItem(exact, iCode);
                else if (e.target.dataset.lastValid && val !== e.target.dataset.lastValid) { iDesc.value = ''; iPrice.value = ''; e.target.dataset.lastValid = ''; }
                renderSuggestions(val, 'item', iCode); calcTotal();
            });
            iCode.addEventListener('focus', () => { handleMobileFocus(iCode); renderSuggestions(iCode.value, 'item', iCode); });
            iDesc.addEventListener('input', (e) => renderSuggestions(e.target.value, 'item', iDesc));
            iDesc.addEventListener('focus', () => { handleMobileFocus(iDesc); renderSuggestions(iDesc.value, 'item', iDesc); });
            [iQty, iPrice].forEach(inp => inp.addEventListener('input', () => calcRow(div)));
        };

        document.getElementById('btnAddRow').addEventListener('click', addItemRow);
        function calcRow(card) {
            const qty = parseFloat(card.querySelector('.i-qty').value) || 0;
            const price = parseFloat(card.querySelector('.i-price').value) || 0;
            card.querySelector('.i-total').innerText = (qty * price).toFixed(2);
            calcTotal();
        }
        window.calcTotal = () => {
            let itemCount = 0, grandTotal = 0;
            document.querySelectorAll('.mobile-item-card').forEach(c => {
                if(c.classList.contains('is-msg')) return;
                if(c.querySelector('.i-code').value.trim() !== '') itemCount++;
                const qty = parseFloat(c.querySelector('.i-qty').value) || 0;
                const price = parseFloat(c.querySelector('.i-price').value) || 0;
                grandTotal += (qty * price);
            });
            document.getElementById('totalQty').innerText = itemCount;
            document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
        };

        // --- SUBMIT PRE-CHECK ---
        let pendingOrderData = null;
        document.getElementById('btnPreSubmit').addEventListener('click', () => {
            const customer = document.getElementById('customerInput').value;
            const rep = document.getElementById('repSelect').value;
            if(!customer || !rep) { showAlert("Please select a Customer and Representative"); return; }

            localStorage.setItem('lastRep', rep);

            const items = [];
            document.querySelectorAll('.mobile-item-card').forEach(c => {
                if (c.classList.contains('is-msg')) {
                    const msg = c.querySelector('.msg-content').value;
                    if(msg.trim()) items.push({ code: "MSG", desc: msg, qty: 0, price: 0, total: 0 });
                } else {
                    const code = c.querySelector('.i-code').value;
                    const qty = c.querySelector('.i-qty').value;
                    if(code) { 
                        items.push({
                            code: code, desc: c.querySelector('.i-desc').value,
                            qty: parseFloat(qty) || 0, price: parseFloat(c.querySelector('.i-price').value) || 0,
                            total: parseFloat(c.querySelector('.i-total').innerText) || 0
                        });
                    }
                }
            });

            if(items.length === 0) { showAlert("Please add at least one item or message"); return; }

            pendingOrderData = {
                customer: {
                    name: customer, code: document.getElementById('custCode').value,
                    address: document.getElementById('custAddress').value, mobile: document.getElementById('custMobile').value
                },
                rep: rep, items: items, grandTotal: parseFloat(document.getElementById('grandTotal').innerText),
                timestamp: Date.now(), 
                date: new Date().toISOString().split('T')[0]
            };

            // POPULATE MODAL
            document.getElementById('psCustomer').innerHTML = `
                <div class="ps-c-icon"><i class="fa-solid fa-user-tag"></i></div>
                <div class="ps-c-info"><h4>${pendingOrderData.customer.name}</h4><p>${pendingOrderData.customer.code}</p></div>`;
            
            let listHtml = '';
            items.forEach(i => {
                if(i.code === 'MSG') listHtml += `<div class="ps-item"><div class="ps-i-desc" style="color:var(--accent-purple); font-style:italic; grid-column:1/-1;">${i.desc}</div></div>`;
                else listHtml += `<div class="ps-item"><div class="ps-i-desc">${i.desc}<small>${i.code}</small></div><div class="ps-i-qty"><span class="qty-badge">${i.qty}</span></div><div class="ps-i-total">${i.total.toFixed(2)}</div></div>`;
            });
            document.getElementById('psItemsList').innerHTML = listHtml;
            document.getElementById('psTotal').innerText = pendingOrderData.grandTotal.toFixed(2);
            document.getElementById('summaryModal').classList.add('open');
        });

        // --- UPDATED SUBMIT LOGIC (SMART OFFLINE/ONLINE) ---
        document.getElementById('btnConfirmSubmit').addEventListener('click', async () => {
            const btn = document.getElementById('btnConfirmSubmit');
            const originalText = btn.innerHTML;
            
            btn.disabled = true; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';
            
            // 1. Force a network check first
            await checkRealInternetConnection();
            
            closeModal('summaryModal');

            if (isOnline) {
                // --- ONLINE: Try Firebase ---
                try {
                    const docData = { ...pendingOrderData, timestamp: serverTimestamp() };
                    await addDoc(collection(db, "orders"), docData);
                    
                    showToast("Order Uploaded Successfully!", "success");
                    
                } catch(err) {
                    console.error("Firebase fail:", err);
                    // Fallback to offline if upload fails
                    saveToOfflineQueue(pendingOrderData);
                    showToast("Connection weak. Saved to Pending.", "offline");
                }
            } else {
                // --- OFFLINE: Save Locally ---
                saveToOfflineQueue(pendingOrderData);
                showToast("You are Offline. Order Saved.", "offline");
            }

            // 2. ALWAYS RESET FORM IMMEDIATELY
            resetForm();
            btn.disabled = false;
            btn.innerHTML = originalText;
        });

        // --- OFFLINE QUEUE MANAGER (PERSISTENT) ---
        function saveToOfflineQueue(order){
            // Ensure timestamp is a number for JSON storage
            order.timestamp = Date.now(); 
            pushOfflineOrder(order);
        }

        async function processOfflineQueue(){
            // Only run if we are truly online
            if(!isOnline) return;

            let queue = getOfflineOrders();
            if(queue.length === 0) return;

            const remaining = [];
            let syncCount = 0;

            for(const order of queue){
                try{
                    const docData = { ...order, timestamp: serverTimestamp() };
                    await addDoc(collection(db,"orders"), docData);
                    syncCount++;
                }catch(e){
                    remaining.push(order);
                }
            }

            setOfflineOrders(remaining);
            updatePendingBadge();
            
            if(syncCount > 0) {
                 showToast(`Synced ${syncCount} pending orders!`, "success");
            }
        }

        function updatePendingBadge(){
            const queue = getOfflineOrders();
            const badge = document.getElementById("pendingBadge");

            if(queue.length > 0){
                badge.style.display="block";
                badge.innerText = queue.length + " Sync Pending";
            }else{
                badge.style.display="none";
            }
        }

        // --- INITIALIZATION ---
        loadData();
        updatePendingBadge();
        
        // 1. Check immediately
        checkRealInternetConnection();
        
        // 2. Poll every 5 seconds
        setInterval(checkRealInternetConnection, 5000);

    </script>
</body>
</html>
