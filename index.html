<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sales Portal | Premium Interface</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        :root {
            --neon-cyan: #06b6d4;
            --neon-blue: #3b82f6;
            --bg-dark: #020617;
            --glass-panel: rgba(15, 23, 42, 0.85);
            --border-color: rgba(6, 182, 212, 0.3);
            --header-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 40%);
            color: #f1f5f9;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* --- LOADER --- */
        #loader {
            position: fixed; inset: 0; background: #020617; z-index: 10000;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(6,182,212,0.1);
            border-top-color: var(--neon-cyan); border-radius: 50%;
            animation: spin 1s infinite linear;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- HEADER --- */
        header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--header-height);
            background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .brand {
            font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text; color: transparent;
        }
        .date-badge {
            font-family: 'Cinzel'; border: 1px solid var(--border-color);
            padding: 5px 15px; border-radius: 20px; font-size: 0.8rem;
            color: var(--neon-cyan); background: rgba(6,182,212,0.05);
        }

        /* --- LAYOUT --- */
        .main-container {
            margin-top: var(--header-height);
            padding: 20px;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
            transition: all 0.3s ease;
        }

        .desktop-wrapper { display: flex; gap: 30px; position: relative; }
        .content-area { flex: 1; width: 100%; transition: width 0.3s ease; }

        /* --- DESKTOP FLOATING SIDEBAR --- */
        #desktopSuggestionsPanel {
            position: fixed; top: calc(var(--header-height) + 20px); right: 20px;
            width: 350px; height: calc(100vh - 120px);
            background: rgba(15, 23, 42, 0.95); border: 1px solid var(--neon-cyan);
            border-radius: 16px; backdrop-filter: blur(20px);
            box-shadow: -10px 10px 30px rgba(0,0,0,0.5);
            z-index: 900; transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; overflow: hidden;
        }
        #desktopSuggestionsPanel.active { transform: translateX(0); }
        @media (min-width: 1200px) { body.sidebar-open .content-area { margin-right: 370px; } }

        .sidebar-header {
            padding: 15px 20px; background: rgba(6, 182, 212, 0.1);
            border-bottom: 1px solid var(--border-color); color: var(--neon-cyan);
            font-family: 'Cinzel'; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
        }
        #desktopSuggestionsContent { flex: 1; overflow-y: auto; padding: 15px; }

        /* --- CARDS --- */
        .glass-card {
            background: var(--glass-panel); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 25px; margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative;
        }
        .glass-card::before {
            content:''; position: absolute; top:0; left:0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--neon-cyan), var(--neon-blue));
            border-radius: 16px 0 0 16px; opacity: 0.7;
        }

        h2 { font-family: 'Cinzel'; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
        h2 i { color: var(--neon-cyan); }

        /* --- INPUTS --- */
        .form-group { margin-bottom: 20px; position: relative; }
        label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        
        input, select, textarea {
            width: 100%; padding: 14px 16px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; color: #fff; font-size: 1rem; transition: all 0.3s;
        }
        
        /* Uppercase input class */
        .uppercase-input { text-transform: uppercase; }

        input:focus, textarea:focus, select:focus {
            border-color: var(--neon-cyan); background: rgba(6, 182, 212, 0.05);
            box-shadow: 0 0 15px rgba(6,182,212,0.15);
        }

        textarea { resize: vertical; min-height: 80px; font-family: 'Inter', sans-serif; }

        /* --- PREMIUM SELECT BOX --- */
        .premium-select { position: relative; cursor: pointer; }
        .premium-select select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 45px; background:rgb(15, 15, 180); border: 1px solid rgba(6, 182, 212, 0.3); }
        .premium-select::after {
            content: '\f107'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: var(--neon-cyan); pointer-events: none; transition: transform 0.3s;
        }
        .premium-select:hover::after { transform: translateY(-50%) scale(1.2); }
        .premium-select option { background: #000000; color: rgb(255, 255, 255); padding: 10px; }

        /* --- MOBILE ITEM CARDS --- */
        .mobile-item-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative;
        }
        .mobile-item-card.focused { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(6,182,212,0.1); background: rgba(6,182,212,0.02); }
        
        /* Message Box Style */
        .mobile-item-card.is-msg {
            border-color: var(--neon-blue);
            background: rgba(59, 130, 246, 0.05);
        }

        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-del {
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444; width: 35px; height: 35px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .total-display { text-align: center; color: var(--neon-cyan); font-family: 'Cinzel'; font-weight: bold; display: flex; flex-direction: column; justify-content: center; height: 100%; font-size: 0.9rem; }

        /* --- MOBILE SUGGESTIONS --- */
        .mobile-suggestions {
            background: rgba(15, 23, 42, 0.95); border: 1px solid var(--neon-cyan); border-top: none;
            border-radius: 0 0 10px 10px; max-height: 200px; overflow-y: auto;
            display: none; margin-top: -2px; position: relative; z-index: 10;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .suggestion-item { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: background 0.2s; }
        .suggestion-item:hover { background: rgba(6, 182, 212, 0.15); }
        .s-main { font-weight: 600; color: #fff; font-size: 0.95rem; }
        .s-sub { font-size: 0.75rem; color: #94a3b8; display: flex; justify-content: space-between; margin-top: 3px; }

        /* --- ADD BUTTON --- */
        .btn-add {
            width: 100%; padding: 15px; margin-top: 10px;
            background: rgba(6,182,212,0.05); border: 1px dashed var(--neon-cyan);
            color: var(--neon-cyan); border-radius: 12px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-add:hover { background: rgba(6,182,212,0.15); }

        /* --- FOOTER --- */
        .action-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-color); padding: 15px 20px; z-index: 1000;
        }
        .action-inner { max-width: 1600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .footer-totals { display: flex; gap: 20px; }
        .f-item small { display: block; font-size: 0.65rem; color: #64748b; font-weight: 700; letter-spacing: 1px; }
        .f-item span { font-family: 'Cinzel'; font-size: 1.1rem; color: var(--neon-cyan); }
        .footer-btns { display: flex; gap: 10px; }
        .btn { padding: 12px 25px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: transform 0.2s; }
        .btn:active { transform: scale(0.96); }
        .btn-reset { background: rgba(255,255,255,0.1); color: #cbd5e1; }
        .btn-submit { background: linear-gradient(135deg, var(--neon-blue), #2563eb); color: white; box-shadow: 0 0 15px rgba(59,130,246,0.4); }

        @media (min-width: 768px) {
            .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            .mobile-suggestions { display: none !important; }
        }
        @media (max-width: 767px) {
            #desktopSuggestionsPanel { display: none !important; }
            .main-container { padding: 10px; padding-bottom: 400px; }
            .glass-card { padding: 15px; }
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div style="margin-top: 20px; color: var(--neon-cyan); font-family: 'Cinzel'; font-size: 1.2rem;">LOADING PORTAL</div>
    </div>

    <header>
        <div class="brand"><i class="fa-solid fa-cube"></i> SALES PORTAL</div>
        <div class="date-badge" id="currentDate"></div>
    </header>

    <aside id="desktopSuggestionsPanel">
        <div class="sidebar-header">
            <span><i class="fa-solid fa-lightbulb"></i> SUGGESTIONS</span>
        </div>
        <div id="desktopSuggestionsContent"></div>
    </aside>

    <div class="main-container">
        <div class="desktop-wrapper">
            <div class="content-area">
                
                <div class="glass-card">
                    <h2><i class="fa-solid fa-user-check"></i> Customer Details</h2>
                    
                    <div class="grid-2">
                        <div class="form-group" id="group-cust">
                            <label>Customer Name / Search</label>
                            <input type="text" id="customerInput" placeholder="Type to search..." autocomplete="off">
                            <div class="mobile-suggestions" id="mobile-cust-suggestions"></div>
                        </div>
                        
                        <div class="form-group">
                            <label>Customer Code</label>
                            <input type="text" id="custCode" style="color:var(--neon-cyan); font-weight:600;">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="custAddress">
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Mobile</label>
                            <input type="text" id="custMobile">
                        </div>
                        <div class="form-group">
                            <label>Sales Representative</label>
                            <div class="premium-select">
                                <select id="repSelect">
                                    <option value="">Select Representative...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass-card">
                    <h2><i class="fa-solid fa-cart-shopping"></i> Order Items</h2>
                    <div id="itemsContainer"></div>
                    <button class="btn-add" id="btnAddRow">
                        <i class="fa-solid fa-plus-circle"></i> ADD NEW LINE
                    </button>
                </div>

            </div>
        </div>
    </div>

    <div class="action-bar">
        <div class="action-inner">
            <div class="footer-totals">
                <div class="f-item">
                    <small>ITEMS</small>
                    <span id="totalQty">0</span>
                </div>
                <div class="f-item">
                    <small>GRAND TOTAL</small>
                    <span id="grandTotal">0.00</span>
                </div>
            </div>
            <div class="footer-btns">
                <button class="btn btn-reset" onclick="location.reload()">RESET</button>
                <button class="btn btn-submit" id="btnSubmit">SUBMIT</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-firestore.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-database.js";

        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyA5o9ttyPpOmRu0zVSUJ6g3H1mf05FkgW4",
            authDomain: "reps-a1259.firebaseapp.com",
            databaseURL: "https://reps-a1259-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "reps-a1259",
            storageBucket: "reps-a1259.firebasestorage.app",
            messagingSenderId: "537453276765",
            appId: "1:537453276765:web:53ebf8674f1bd36a04e7b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        // STATE
        let customersData = [];
        let itemsData = [];
        const isMobile = () => window.innerWidth < 768;

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString();

        // --- GLOBAL KEY NAVIGATION & ENTER LOGIC ---
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') {
                e.preventDefault();
                const current = e.target;

                // CHECK FOR "MG" COMMAND
                if(current.classList.contains('i-code') && current.value.toLowerCase() === 'mg') {
                    transformToMsgBox(current);
                    return;
                }

                // NAVIGATION
                const focusable = Array.from(document.querySelectorAll('input:not([type=hidden]):not([disabled]), select, textarea'));
                const index = focusable.indexOf(current);
                if (index > -1 && index < focusable.length - 1) {
                    focusable[index + 1].focus();
                }
            }
        });

        function transformToMsgBox(inputEl) {
            const card = inputEl.closest('.mobile-item-card');
            card.classList.add('is-msg');
            card.innerHTML = `
                <div class="item-header">
                    <div style="flex:1; color: var(--neon-blue); font-weight:bold;">
                        <i class="fa-solid fa-comment-dots"></i> SPECIAL MESSAGE
                    </div>
                    <div onclick="this.closest('.mobile-item-card').remove(); calcTotal();" class="btn-del">
                        <i class="fa-solid fa-trash"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Message Content</label>
                    <textarea class="msg-content" placeholder="Type your message here..."></textarea>
                </div>
            `;
            // Focus the new textarea
            setTimeout(() => {
                const ta = card.querySelector('textarea');
                if(ta) ta.focus();
            }, 100);
        }

        // --- DATA LOADING ---
        async function loadData() {
            try {
                const snap = await get(child(ref(rtdb), "encryption_keys"));
                if(!snap.exists()) throw new Error("Key fetch failed");
                const keys = snap.val();
                
                const keyHex = CryptoJS.enc.Hex.parse(keys.itemsKey || keys.key);
                const ivHex = CryptoJS.enc.Hex.parse(keys.itemsIv || keys.iv);

                const decrypt = async (file) => {
                    const res = await fetch(`https://raw.githubusercontent.com/prabod-arpico/New-Order/refs/heads/main/database/${file}`);
                    const buff = await res.arrayBuffer();
                    const wa = CryptoJS.lib.WordArray.create(buff);
                    const dec = CryptoJS.AES.decrypt(
                        { ciphertext: wa }, keyHex, 
                        { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
                    );
                    return JSON.parse(dec.toString(CryptoJS.enc.Utf8));
                };

                const [rawCust, rawItm, rawReps] = await Promise.all([
                    decrypt("Customer.json.enc"),
                    decrypt("Items.json.enc"),
                    getDocs(collection(db, "reps"))
                ]);

                customersData = normalize(rawCust, 'customer');
                itemsData = normalize(rawItm, 'item');

                const repSel = document.getElementById('repSelect');
                const reps = [];
                rawReps.forEach(d => reps.push(d.data().name));
                reps.sort().forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = opt.text = r;
                    repSel.appendChild(opt);
                });

                document.getElementById('loader').style.display = 'none';
                addItemRow();
                
            } catch (e) {
                alert("Error loading data: " + e.message);
                document.getElementById('loader').style.display = 'none';
            }
        }

        function normalize(data, type) {
            if(!Array.isArray(data)) return [];
            return data.map(item => {
                const k = Object.keys(item);
                if(type === 'customer') {
                    return {
                        name: item[k.find(x => /name/i.test(x)) || 'name'] || '',
                        code: item[k.find(x => /code/i.test(x)) || 'code'] || '',
                        address: item[k.find(x => /address/i.test(x)) || 'address'] || '',
                        mobile: item[k.find(x => /mobile|phone/i.test(x)) || 'mobile'] || ''
                    };
                } else {
                    return {
                        code: item[k.find(x => /code/i.test(x)) || 'code'] || '',
                        desc: item[k.find(x => /desc/i.test(x)) || 'description'] || '',
                        price: parseFloat(item[k.find(x => /price|rate/i.test(x)) || 'price']) || 0
                    };
                }
            });
        }

        loadData();

        // --- UI LOGIC ---

        function handleMobileFocus(element) {
            if(!isMobile()) return;
            setTimeout(() => {
                const headerOffset = 80;
                const elementPosition = element.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                window.scrollTo({ top: offsetPosition, behavior: "smooth" });
                const card = element.closest('.mobile-item-card');
                if(card) {
                    document.querySelectorAll('.mobile-item-card').forEach(c => c.classList.remove('focused'));
                    card.classList.add('focused');
                }
            }, 300);
        }

        function toggleDesktopPanel(show, contentHTML = "") {
            const panel = document.getElementById('desktopSuggestionsPanel');
            const body = document.body;
            if(!panel) return;

            if (show && !isMobile()) {
                document.getElementById('desktopSuggestionsContent').innerHTML = contentHTML;
                panel.classList.add('active');
                body.classList.add('sidebar-open');
                
                // Add click events to desktop suggestions
                document.querySelectorAll('#desktopSuggestionsContent .suggestion-item').forEach(el => {
                   // Listener attached in renderSuggestions logic via closure 
                });
            } else {
                panel.classList.remove('active');
                body.classList.remove('sidebar-open');
            }
        }

        document.addEventListener('click', (e) => {
            if(!e.target.closest('input') && !e.target.closest('#desktopSuggestionsPanel')) {
                toggleDesktopPanel(false);
            }
        });

        // --- CUSTOMER SEARCH ---
        const custInput = document.getElementById('customerInput');
        
        // Double Click to Clear Customer
        custInput.addEventListener('dblclick', () => {
            custInput.value = '';
            document.getElementById('custCode').value = '';
            document.getElementById('custAddress').value = '';
            document.getElementById('custMobile').value = '';
        });

        custInput.addEventListener('focus', () => {
            handleMobileFocus(custInput);
            renderSuggestions(custInput.value, 'customer');
        });

        custInput.addEventListener('input', (e) => {
            const val = e.target.value;
            // Free typing allowed, so don't auto-clear unless empty
            if(!val) {
                document.getElementById('custCode').value = '';
                document.getElementById('custAddress').value = '';
                document.getElementById('custMobile').value = '';
            }
            // Auto Select Exact Match
            const exact = customersData.find(c => c.code.toLowerCase() === val.toLowerCase() || c.name.toLowerCase() === val.toLowerCase());
            if(exact) {
                selectCustomer(exact);
            }
            
            renderSuggestions(val, 'customer');
        });

        function renderSuggestions(query, type, contextEl = null) {
            let matches = [];
            const q = query.toLowerCase();

            if (type === 'customer') {
                matches = customersData.filter(c => c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q)).slice(0, 20);
            } else {
                matches = itemsData.filter(i => i.code.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)).slice(0, 20);
            }

            const html = matches.length ? matches.map(m => {
                if (type === 'customer') {
                    return `<div class="suggestion-item">
                        <div class="s-main">${m.name}</div>
                        <div class="s-sub"><span>${m.address}</span><span>${m.code}</span></div>
                    </div>`;
                } else {
                    return `<div class="suggestion-item">
                        <div class="s-main">${m.code} <br> ↪ ${m.desc} </div>
                    </div>`;
                }
            }).join('') : '<div style="padding:20px; text-align:center; color:#64748b;">No matches found</div>';

            // Common Handler for Click
            const attachListeners = (container) => {
                container.querySelectorAll('.suggestion-item').forEach((el, idx) => {
                    el.addEventListener('click', () => {
                        if(type === 'customer') selectCustomer(matches[idx]);
                        else selectItem(matches[idx], contextEl);
                        if(isMobile()) container.style.display = 'none';
                        else toggleDesktopPanel(false);
                    });
                });
            };

            if (isMobile()) {
                const target = type === 'customer' ? 
                    document.getElementById('mobile-cust-suggestions') : 
                    contextEl.parentNode.querySelector('.mobile-suggestions');
                target.innerHTML = html;
                target.style.display = matches.length ? 'block' : 'none';
                attachListeners(target);
            } else {
                toggleDesktopPanel(true, html);
                attachListeners(document.getElementById('desktopSuggestionsContent'));
            }
        }

        window.selectCustomer = (c) => {
            if(typeof c === 'string') c = customersData.find(x => x.code === c);
            if(!c) return;
            document.getElementById('customerInput').value = c.name;
            document.getElementById('custCode').value = c.code;
            document.getElementById('custAddress').value = c.address;
            document.getElementById('custMobile').value = c.mobile;
        };

        window.selectItem = (item, inputElement) => {
            const card = inputElement.closest('.mobile-item-card');
            const inputs = card.querySelectorAll('input');
            
            inputs[0].value = item.code; // Code
            inputs[1].value = item.desc; // Desc
            inputs[3].value = item.price.toFixed(2); // Price
            
            // Store the "locked" code to detect changes later
            inputs[0].dataset.lastValid = item.code;
            
            calcRow(card);
            inputs[2].focus(); // Focus Qty
        };

        // --- DYNAMIC ITEMS ---
        const itemsContainer = document.getElementById('itemsContainer');

        window.addItemRow = () => {
            const div = document.createElement('div');
            div.className = 'mobile-item-card fade-in';
            div.innerHTML = `
                <div class="item-header">
                    <div style="flex:1">
                        <label>Item Code</label>
                        <input type="text" class="i-code uppercase-input" placeholder="Search Code" autocomplete="off">
                        <div class="mobile-suggestions"></div>
                    </div>
                    <div onclick="this.closest('.mobile-item-card').remove(); calcTotal();" class="btn-del">
                        <i class="fa-solid fa-trash"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" class="i-desc" placeholder="Description" autocomplete="off">
                    <div class="mobile-suggestions"></div>
                </div>
                <div class="grid-3">
                    <div class="form-group">
                        <label>Qty</label>
                        <input type="number" class="i-qty" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Price</label>
                        <input type="number" class="i-price" placeholder="0.00">
                    </div>
                    <div class="total-display">
                        <small>TOTAL</small>
                        <span class="i-total">0.00</span>
                    </div>
                </div>
            `;
            itemsContainer.appendChild(div);

            const iCode = div.querySelector('.i-code');
            const iDesc = div.querySelector('.i-desc');
            const iQty = div.querySelector('.i-qty');
            const iPrice = div.querySelector('.i-price');
            
            // 1. Double Click Clear Logic
            div.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('dblclick', (e) => {
                    e.target.value = '';
                    // If code cleared, clear dependencies
                    if(e.target.classList.contains('i-code')) {
                        iDesc.value = '';
                        iPrice.value = '';
                        e.target.dataset.lastValid = '';
                    }
                    calcRow(div);
                });
            });

            // 2. Code Input Logic (Upper, Auto Select, Dependencies)
            iCode.addEventListener('input', (e) => {
                // Force Uppercase
                e.target.value = e.target.value.toUpperCase();
                const val = e.target.value;

                // Auto Select Exact Match
                const exact = itemsData.find(i => i.code === val);
                if(exact) {
                    selectItem(exact, iCode);
                } else {
                    // Logic: If user changes code and it's NOT exact match, 
                    // and previously it WAS a valid code, clear dependencies to prevent mismatch
                    if (e.target.dataset.lastValid && val !== e.target.dataset.lastValid) {
                        iDesc.value = '';
                        iPrice.value = '';
                        e.target.dataset.lastValid = ''; // Reset
                    }
                }
                
                renderSuggestions(val, 'item', iCode);
            });

            iCode.addEventListener('focus', () => {
                handleMobileFocus(iCode);
                renderSuggestions(iCode.value, 'item', iCode);
            });

            // 3. Desc Search Logic
            iDesc.addEventListener('input', (e) => renderSuggestions(e.target.value, 'item', iDesc));
            iDesc.addEventListener('focus', () => {
                handleMobileFocus(iDesc);
                renderSuggestions(iDesc.value, 'item', iDesc);
            });

            // 4. Calc Logic
            [iQty, iPrice].forEach(inp => {
                inp.addEventListener('focus', () => handleMobileFocus(inp));
                inp.addEventListener('input', () => calcRow(div));
            });
        };

        document.getElementById('btnAddRow').addEventListener('click', addItemRow);

        function calcRow(card) {
            const qty = parseFloat(card.querySelector('.i-qty').value) || 0;
            const price = parseFloat(card.querySelector('.i-price').value) || 0;
            const total = qty * price;
            card.querySelector('.i-total').innerText = total.toFixed(2);
            calcTotal();
        }

        window.calcTotal = () => {
            let q = 0, t = 0;
            document.querySelectorAll('.mobile-item-card').forEach(c => {
                if(c.classList.contains('is-msg')) return; // Skip msg boxes
                const qty = parseFloat(c.querySelector('.i-qty').value) || 0;
                const price = parseFloat(c.querySelector('.i-price').value) || 0;
                q += qty;
                t += (qty * price);
            });
            document.getElementById('totalQty').innerText = q;
            document.getElementById('grandTotal').innerText = t.toFixed(2);
        };

        // --- SUBMIT ---
        document.getElementById('btnSubmit').addEventListener('click', async () => {
            const btn = document.getElementById('btnSubmit');
            const customer = document.getElementById('customerInput').value;
            const rep = document.getElementById('repSelect').value;

            if(!customer || !rep) {
                alert("Please select a Customer and Representative");
                return;
            }

            const items = [];
            document.querySelectorAll('.mobile-item-card').forEach(c => {
                if (c.classList.contains('is-msg')) {
                    // Handle Message Row
                    const msg = c.querySelector('.msg-content').value;
                    if(msg.trim()) {
                        items.push({
                            code: "MSG",
                            desc: msg,
                            qty: 0,
                            price: 0,
                            total: 0
                        });
                    }
                } else {
                    // Handle Standard Row
                    const code = c.querySelector('.i-code').value;
                    const qty = c.querySelector('.i-qty').value;
                    if(code) { // Allow anything, even if 0 qty
                        items.push({
                            code: code,
                            desc: c.querySelector('.i-desc').value,
                            qty: parseFloat(qty) || 0,
                            price: parseFloat(c.querySelector('.i-price').value) || 0,
                            total: parseFloat(c.querySelector('.i-total').innerText) || 0
                        });
                    }
                }
            });

            if(items.length === 0) {
                alert("Please add at least one item or message");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                await addDoc(collection(db, "orders"), {
                    customer: {
                        name: customer,
                        code: document.getElementById('custCode').value,
                        address: document.getElementById('custAddress').value,
                        mobile: document.getElementById('custMobile').value
                    },
                    rep: rep,
                    items: items,
                    grandTotal: parseFloat(document.getElementById('grandTotal').innerText),
                    timestamp: serverTimestamp(),
                    date: new Date().toISOString().split('T')[0]
                });
                alert("Order Submitted Successfully!");
                location.reload();
            } catch (e) {
                alert("Error: " + e.message);
                btn.disabled = false;
                btn.innerText = "SUBMIT";
            }
        });

    </script>
</body>
</html>
