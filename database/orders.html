<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orders – Prabodfx</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #030712;
  --surface: rgba(17, 24, 39, 0.6);
  --surface-highlight: rgba(31, 41, 55, 0.7);
  --border: rgba(255, 255, 255, 0.08);
  --primary: #6366f1; /* Indigo */
  --secondary: #06b6d4; /* Cyan */
  --accent: #f43f5e; /* Rose */
  --success: #10b981; /* Emerald */
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --glass: blur(16px) saturate(180%);
}

* { box-sizing: border-box; font-family: 'Inter', sans-serif; outline: none; }

/* UTILITY TO HIDE ELEMENTS */
.hidden { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  background-image: 
    radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
  color: var(--text-main);
  padding: 32px;
  overflow-x: hidden;
  user-select: none;
}

/* --- HEADER --- */
header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
header h1 {
  font-size: 2rem;
  font-weight: 700;
  margin: 0;
  background: linear-gradient(to right, #fff, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* --- SECTIONS --- */
.section-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text-muted);
  margin: 40px 0 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: default;
}
.section-title i { color: var(--primary); }

.toggle-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--border);
  color: var(--text-main);
  border-radius: 6px;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  cursor: pointer;
  margin-left: 10px;
  transition: 0.2s;
}
.toggle-btn:hover { background: var(--primary); }

/* --- GRID --- */
.orders-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 24px;
}

/* --- CARD --- */
.order-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.order-card:hover {
  transform: translateY(-4px);
  background: var(--surface-highlight);
  border-color: rgba(99, 102, 241, 0.3);
  box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center; /* Center Vertically */
  margin-bottom: 12px;
  height: 32px; /* Fixed height for alignment */
}

/* Standard Order ID Style */
.order-id {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--secondary);
  background: rgba(6, 182, 212, 0.1);
  padding: 4px 8px;
  border-radius: 6px;
}
.timestamp { font-size: 0.75rem; color: var(--text-muted); }

.customer-name {
  font-size: 1.4rem;
  font-weight: 600;
  margin-bottom: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stats {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}
.stat-pill {
  font-size: 0.75rem;
  padding: 6px 12px;
  border-radius: 100px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
}
.stat-pill i { color: var(--primary); }

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.total-amount { font-size: 1.2rem; font-weight: 700; color: #fff; }

/* --- COMPLETED CARD VARIANT (PREMIUM LOOK) --- */
.order-card.completed {
  background: linear-gradient(145deg, rgba(16, 185, 129, 0.05) 0%, rgba(17, 24, 39, 0.8) 100%);
  border: 1px solid rgba(16, 185, 129, 0.2);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.order-card.completed:hover {
  border-color: rgba(16, 185, 129, 0.5);
  box-shadow: 0 10px 30px rgba(16, 185, 129, 0.15);
}

/* PREMIUM INVOICE NUMBER TAG (Right Side) */
.invoice-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  font-weight: 700;
  
  /* Gradient Text */
  background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  
  /* Premium Border & Background */
  border: 1px solid rgba(16, 185, 129, 0.4);
  background: rgba(16, 185, 129, 0.05);
  
  /* Round / Pill Shape */
  padding: 6px 14px;
  border-radius: 999px; /* Fully Round */
  
  /* Glow */
  box-shadow: 0 2px 10px rgba(16, 185, 129, 0.1);
  display: inline-block;
  letter-spacing: 0.5px;
}

/* --- MODAL --- */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.modal.active { opacity: 1; }

.modal-inner {
  width: 95%;
  max-width: 1000px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
}

.sheet {
  background: #0f172a;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 0;
  box-shadow: 0 50px 100px -20px rgba(0,0,0,0.8);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  max-height: 90vh;
}

/* Modal Header */
.sheet-head {
  padding: 24px 32px;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sheet-head-left { flex: 1; }
.customer-address {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-top: 4px;
}
.sheet-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.nvat-btn {
  background: var(--primary);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  transition: 0.2s;
  display: flex; align-items: center; gap: 8px;
}
.nvat-btn:hover { background: #4f46e5; box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }

.close-btn {
  background: rgba(255,255,255,0.05);
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  color: #fff;
  cursor: pointer;
  transition: 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.close-btn:hover { background: var(--accent); transform: rotate(90deg); }

/* Modal Body */
.sheet-body {
  padding: 32px;
  overflow-y: auto;
  scroll-behavior: smooth;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.info-box {
  background: rgba(255,255,255,0.03);
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  cursor: pointer; 
}
.info-box label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
.info-box div { font-weight: 600; font-size: 1rem; }

/* MSG SECTION */
.msg-section {
  background: rgba(99, 102, 241, 0.05);
  border: 1px dashed rgba(99, 102, 241, 0.3);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 30px;
  display: flex;
  gap: 16px;
}
.msg-content h4 { margin: 0 0 4px; font-size: 0.9rem; color: var(--primary); }
.msg-content p { margin: 0; font-size: 0.85rem; color: #cbd5e1; }

/* Table */
.table-container {
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
thead { background: rgba(255,255,255,0.02); }
th { padding: 16px; text-align: left; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
td { padding: 16px; border-top: 1px solid var(--border); font-size: 0.9rem; }
tr { transition: 0.2s; border-left: 3px solid transparent; }
tr:hover { background: rgba(255,255,255,0.02); }

/* Selected / Special Rows */
tr.selected-row {
  background: rgba(99, 102, 241, 0.1);
  border-left: 3px solid var(--primary) !important;
}
tr.out-of-stock {
  background: rgba(239, 68, 68, 0.15) !important;
  border-left: 3px solid #ef4444 !important;
}
tr.out-of-stock td { color: #fca5a5; text-decoration: line-through; }

.col-right { text-align: right; font-family: 'JetBrains Mono', monospace; }

/* --- CALCULATOR --- */
.calc-box {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.95);
  width: 360px;
  background: rgba(15, 23, 42, 0.95);
  border: 1px solid rgba(99, 102, 241, 0.4);
  box-shadow: 0 0 40px rgba(99, 102, 241, 0.2), 0 20px 50px rgba(0,0,0,0.8);
  border-radius: 24px;
  padding: 24px;
  z-index: 200;
  display: none;
  opacity: 0;
  transition: all 0.2s;
}
.calc-box.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom:12px; }
.calc-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 12px; border-radius: 10px; color: #fff; font-family: 'JetBrains Mono'; margin-top: 6px;}
.result-box { background: linear-gradient(135deg, var(--primary), var(--secondary)); padding: 16px; border-radius: 12px; text-align: center; margin-top: 20px; }
.result-val { font-size: 1.8rem; font-weight: 800; }

/* --- PREMIUM INPUT MODAL --- */
.input-modal {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
  z-index: 300; display: none; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.3s;
}
.input-modal.active { opacity: 1; }
.input-box {
  background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
  width: 400px; padding: 24px; border-radius: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.2s;
}
.input-modal.active .input-box { transform: scale(1); }
.input-box h3 { margin: 0 0 16px; color: var(--text-main); font-size: 1.2rem; }
.input-box input {
  width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
  padding: 14px; border-radius: 8px; color: #fff; font-size: 1.1rem;
  margin-bottom: 20px;
}
.input-box input:focus { border-color: var(--primary); }
.input-actions { display: flex; justify-content: flex-end; gap: 10px; }
.btn { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
.btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
.btn-save { background: var(--primary); color: #fff; }

/* --- TOAST --- */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(220, 38, 38, 0.9); color: white; padding: 12px 24px; border-radius: 50px;
  font-weight: 600; font-size: 0.9rem; display: flex; gap: 10px; z-index: 400;
  opacity: 0; pointer-events: none; transition: all 0.3s ease;
}
.toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: rgba(16, 185, 129, 0.9); }
</style>
</head>

<body>

<header>
  <div><h1>Dashboard</h1></div>
  <div style="font-size: 0.8rem; color: var(--text-muted);">
    <i class="fa-solid fa-circle" style="color: #10b981; font-size: 8px; margin-right: 6px;"></i>Live Connection
  </div>
</header>

<div class="section-title"><i class="fa-regular fa-clock"></i> Pending Orders (Not Completed)</div>
<div id="orders" class="orders-grid"></div>

<div class="section-title hidden" id="completedHeader" style="margin-top: 60px;">
  <i class="fa-solid fa-check-double"></i> Completed Invoices
  <div class="toggle-btn" id="toggleBtn">+</div>
</div>
<div id="invoices" class="orders-grid hidden"></div>

<div class="modal" id="modal">
  <div class="modal-inner">
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<div id="inputModal" class="input-modal">
  <div class="input-box">
    <h3>Enter Invoice Number</h3>
    <input type="text" id="nvatInput" placeholder="Ex: INV-2024-001" autocomplete="off">
    <div class="input-actions">
      <button class="btn btn-cancel" onclick="closeInputModal()">Cancel</button>
      <button class="btn btn-save" onclick="submitNVAT()">Save Invoice</button>
    </div>
  </div>
</div>

<div class="calc-box" id="calcBox">
  <div class="calc-header">
    <div><h4 id="calcTitle">Margin Calc</h4><div style="font-size: 0.7rem; color:var(--text-muted);" id="calcItemName">Item</div></div>
    <span style="background:var(--primary); font-size:0.7rem; padding:2px 8px; border-radius:4px;" id="calcCode">CODE</span>
  </div>
  <div style="margin-bottom:16px;">
    <label style="font-size:0.75rem; color:var(--text-muted);">Selling Price</label>
    <input type="number" id="calcInput" class="calc-input" placeholder="0.00" />
  </div>
  <div>
    <label style="font-size:0.75rem; color:var(--text-muted);">Cost Price</label>
    <input type="number" id="calcPrice" class="calc-input" placeholder="0.00" />
  </div>
  <div class="result-box">
    <div style="font-size:0.75rem; margin-bottom:4px;">PROFIT MARGIN</div>
    <div class="result-val" id="calcResult">0.00%</div>
  </div>
  <div style="margin-top:16px; text-align:center; font-size:0.7rem; color:var(--text-muted);">Press <strong>ENTER</strong> to save</div>
</div>

<div id="toast" class="toast">
  <i class="fa-solid fa-triangle-exclamation" id="toastIcon"></i>
  <span id="toastMsg">Notification</span>
</div>

<script type="module">
// --- IMPORTS ---
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-analytics.js";
import { getFirestore, collection, onSnapshot, query, orderBy, limit, updateDoc, doc, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

// --- CONFIG ---
const firebaseConfig = {
  apiKey: "AIzaSyA5o9ttyPpOmRu0zVSUJ6g3H1mf05FkgW4",
  authDomain: "reps-a1259.firebaseapp.com",
  databaseURL: "https://reps-a1259-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "reps-a1259",
  storageBucket: "reps-a1259.firebasestorage.app",
  messagingSenderId: "537453276765",
  appId: "1:537453276765:web:53ebf8674f1bd36a04e7b4",
  measurementId: "G-1S0ME1X96X"
};

// Initialize
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);

// DOM
const ordersDiv = document.getElementById("orders");
const invoicesDiv = document.getElementById("invoices");
const modal = document.getElementById("modal");
const sheet = document.getElementById("sheet");
const calcBox = document.getElementById("calcBox");
const calcInput = document.getElementById("calcInput"); 
const calcPrice = document.getElementById("calcPrice"); 
const calcResult = document.getElementById("calcResult");
const toast = document.getElementById("toast");
const toastMsg = document.getElementById("toastMsg");
const inputModal = document.getElementById("inputModal");
const nvatInput = document.getElementById("nvatInput");

// Toggle Logic Elements
const toggleBtn = document.getElementById("toggleBtn");
const completedHeader = document.getElementById("completedHeader");

// State
let currentItems = [];
let currentIndex = 0;
let currentDocId = "";
let currentOrderData = {};
let copyStep = 0;
let outOfStockIndices = new Set(); 
let isCompletedSectionVisible = false; // Default Hidden

// --- TOGGLE LOGIC ---
function toggleCompleted() {
  isCompletedSectionVisible = !isCompletedSectionVisible;
  if(isCompletedSectionVisible) {
    invoicesDiv.classList.remove("hidden");
    completedHeader.classList.remove("hidden"); // Show Header
    toggleBtn.innerText = "-";
  } else {
    invoicesDiv.classList.add("hidden");
    completedHeader.classList.add("hidden"); // Hide Header
    toggleBtn.innerText = "+";
  }
}

// Keep click for UI consistency, but keyboard is main
toggleBtn.onclick = (e) => { e.stopPropagation(); toggleCompleted(); };
completedHeader.onclick = toggleCompleted;


// --- BLOCK CONTEXT MENU ---
document.addEventListener('contextmenu', event => event.preventDefault());

// 1. Fetch Pending Orders (Not Completed Section)
onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), snap => {
  ordersDiv.innerHTML = "";
  snap.forEach(d => {
    const data = d.data();
    const card = createCard(d.id, data, false);
    ordersDiv.appendChild(card);
  });
});

// 2. Fetch Completed Invoices (Completed Section)
onSnapshot(query(collection(db, "invoices"), orderBy("timestamp", "desc"), limit(50)), snap => {
  invoicesDiv.innerHTML = "";
  snap.forEach(d => {
    const data = d.data();
    const card = createCard(d.id, data, true);
    invoicesDiv.appendChild(card);
  });
});

// Helper: Create Card HTML
function createCard(id, data, isCompleted) {
  const card = document.createElement("div");
  card.className = `order-card ${isCompleted ? 'completed' : ''}`;
  const date = new Date(data.timestamp?.seconds * 1000 || Date.now()).toLocaleDateString();
  const realItemCount = (data.items || []).filter(i => i.code !== "MSG").length;
  
  // Calculate total
  let displayTotal = data.grandTotal;
  if (!displayTotal && data.items) {
      displayTotal = data.items.reduce((acc, i) => acc + (parseFloat(i.price || 0) * (i.qty || 0)), 0);
  }

  // --- TOP CONTENT LOGIC ---
  let topContent = '';
  
  if (isCompleted) {
    topContent = `
      <span class="timestamp">${date}</span>
      <span class="invoice-tag">#${data.invoiceNumber}</span>
    `;
  } else {
    topContent = `
      <span class="order-id">#${id.slice(-6).toUpperCase()}</span>
      <span class="timestamp">${date}</span>
    `;
  }

  card.innerHTML = `
    <div class="card-top">
      ${topContent}
    </div>
    <div class="customer-name" title="${data.customer?.name}">${data.customer?.name || "Unknown"}</div>
    <div class="stats">
      <div class="stat-pill"><i class="fa-solid fa-user-tie"></i> ${data.rep || "Direct"}</div>
      <div class="stat-pill"><i class="fa-solid fa-box"></i> ${realItemCount} Items</div>
    </div>
    <div class="card-footer">
      <div style="display: flex; flex-direction: column;">
        <span style="font-size:0.75rem; color:var(--text-muted);">${isCompleted ? 'INVOICED' : 'TOTAL'}</span>
        ${isCompleted ? `<span style="font-size: 0.75rem; color: var(--success); font-family: 'JetBrains Mono';">INV: ${data.invoiceNumber}</span>` : ''}
      </div>
      <span class="total-amount">LKR ${(displayTotal || 0).toLocaleString()}</span>
    </div>
  `;
  
  // Allow opening for both, pass isCompleted flag
  card.onclick = () => openOrder(id, data, isCompleted);
  
  return card;
}

// 3. Open Order Modal
function openOrder(id, data, isReadOnly = false) {
  currentDocId = id;
  currentOrderData = data;
  copyStep = 0;
  outOfStockIndices.clear(); 
  
  const rawItems = data.items || [];
  const msgItem = rawItems.find(item => item.code === "MSG");
  const msgContent = msgItem ? msgItem.desc : (data.notes || "No special instructions.");
  currentItems = rawItems.filter(item => item.code !== "MSG");
  currentIndex = 0;
  
  const titleText = isReadOnly ? `INVOICE: ${data.invoiceNumber}` : `ORDER #${id.slice(-6).toUpperCase()}`;
  const nvatBtnDisplay = isReadOnly ? "none" : "flex";

  sheet.innerHTML = `
    <div class="sheet-head">
      <div class="sheet-head-left">
        <div style="font-size:0.8rem; color:${isReadOnly ? 'var(--success)' : 'var(--secondary)'}; margin-bottom:4px;">${titleText}</div>
        <h2 class="customer-name-header">${data.customer?.name || "Customer"}</h2>
        <div class="customer-address">${data.customer?.address || ""}</div>
      </div>
      <div class="sheet-actions">
        <button id="nvatBtn" class="nvat-btn" style="display:${nvatBtnDisplay}"><i class="fa-solid fa-file-invoice"></i> NVAT</button>
        <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <div class="sheet-body" id="sheetBody">
      <div class="msg-section">
        <div style="font-size:1.2rem; color:var(--primary);"><i class="fa-regular fa-comment-dots"></i></div>
        <div class="msg-content">
          <h4>Order Notes</h4>
          <p>${msgContent}</p>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-box" id="box-code"><label>Code</label><div>${data.customer?.code || "-"}</div></div>
        <div class="info-box" id="box-rep"><label>Rep</label><div>${data.rep || "-"}</div></div>
        <div class="info-box" id="box-date"><label>Date</label><div>${new Date(data.timestamp?.seconds * 1000).toLocaleDateString()}</div></div>
      </div>

      <div class="table-container">
        <table>
          <thead><tr><th>Code</th><th>Description</th><th class="col-right">Qty</th><th class="col-right">Price</th></tr></thead>
          <tbody>
            ${currentItems.map((item, idx) => `
              <tr id="row-${idx}" data-index="${idx}">
                <td><span style="color:var(--text-muted)">${item.code}</span></td>
                <td><strong style="color:#fff">${item.desc}</strong></td>
                <td class="col-right">${item.qty}</td>
                <td class="col-right">${Number(item.price).toLocaleString()}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  sheet.onclick = handleInvoiceClick;
  sheet.onmousedown = (e) => { if (e.ctrlKey) e.preventDefault(); };
  sheet.oncontextmenu = handleRightClick;
  
  if(!isReadOnly) {
    document.getElementById("nvatBtn").onclick = openInputModal;
  }

  modal.style.display = "flex";
  setTimeout(() => modal.classList.add("active"), 10);
}

// 4. Highlight & Scroll
function highlightRow(index) {
  const allRows = sheet.querySelectorAll("tbody tr");
  allRows.forEach(r => r.classList.remove("selected-row"));
  const targetRow = document.getElementById(`row-${index}`);
  if(targetRow) {
    targetRow.classList.add("selected-row");
    targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// 5. Main Click Logic
function handleInvoiceClick(e) {
  if (e.target.closest("button") || e.target.closest("input")) return;

  // === MARK RED (OUT OF STOCK) ===
  if (e.shiftKey) {
    e.preventDefault();
    e.stopPropagation();
    const tr = e.target.closest("tr[data-index]");
    if (tr) {
      const idx = parseInt(tr.dataset.index);
      if (outOfStockIndices.has(idx)) {
        outOfStockIndices.delete(idx);
        tr.classList.remove("out-of-stock");
        showToast("Marked: Available (Will go to Completed)", true);
      } else {
        outOfStockIndices.add(idx);
        tr.classList.add("out-of-stock");
        showToast("Marked: Out of Stock (Stays in Not Completed)", false);
      }
    }
    return;
  }

  // === COPY LOGIC ===
  if (e.ctrlKey) {
    e.preventDefault();
    e.stopPropagation();
    let textToCopy = "";
    const target = e.target;
    const infoBox = target.closest(".info-box");
    if (infoBox) {
      const label = infoBox.querySelector("label")?.innerText;
      const valDiv = infoBox.querySelector("div");
      if (label === "REP" && valDiv) textToCopy = valDiv.innerText.trim().slice(-6); 
      else if (valDiv) textToCopy = valDiv.innerText.trim();
    } else if (target.closest("td")) {
      textToCopy = target.closest("td").innerText.trim();
      const tr = target.closest("tr");
      if(tr) highlightRow(parseInt(tr.dataset.index));
    }
    if (textToCopy) navigator.clipboard.writeText(textToCopy).then(() => showToast(`Copied: ${textToCopy}`, true));
    return;
  }

  if (window.getSelection().toString().length > 0) return;

  let textToCopy = "";
  let feedback = "";

  if (copyStep === 0) {
    document.getElementById("sheetBody").scrollTop = 0; 
    textToCopy = currentOrderData.customer?.code || "";
    feedback = "Copied Cust Code";
    copyStep++;
  } else if (copyStep === 1) {
    textToCopy = (currentOrderData.rep || "").trim().slice(-6); 
    feedback = "Copied Rep ID";
    copyStep++;
  } else {
    const adjustedStep = copyStep - 2;
    const itemIndex = Math.floor(adjustedStep / 2);
    const isQty = (adjustedStep % 2 !== 0);

    if (itemIndex < currentItems.length) {
      const item = currentItems[itemIndex];
      highlightRow(itemIndex);
      currentIndex = itemIndex; 
      if (!isQty) {
        textToCopy = item.code;
        feedback = `Copied Code (${item.code})`;
      } else {
        textToCopy = item.qty.toString();
        feedback = `Copied Qty (${item.qty})`;
      }
      copyStep++;
    } else {
      showToast("End of Items List", false);
      return;
    }
  }

  if(textToCopy) navigator.clipboard.writeText(textToCopy).then(() => showToast(feedback, true));
}

// 6. Right Click
function handleRightClick(e) {
  e.preventDefault(); 
  const tr = e.target.closest("tr[data-index]");
  if (e.ctrlKey && tr) {
    const idx = parseInt(tr.dataset.index);
    currentIndex = idx; 
    highlightRow(idx);  
    openCalc(idx);
  }
}

// 7. NVAT Logic
window.openInputModal = function(e) {
  if(e) e.stopPropagation();
  nvatInput.value = "";
  inputModal.style.display = "flex";
  setTimeout(() => inputModal.classList.add("active"), 10);
  nvatInput.focus();
}

window.closeInputModal = function() {
  inputModal.classList.remove("active");
  setTimeout(() => inputModal.style.display = "none", 300);
}

window.submitNVAT = async function() {
  const invoiceNum = nvatInput.value.trim();
  if (!invoiceNum) {
    showToast("Please enter Invoice Number", false);
    return;
  }
  closeInputModal();
  await processNVAT(invoiceNum);
}

// === MAIN SPLIT LOGIC ===
async function processNVAT(invoiceNum) {
  const filledItems = [];    
  const retainedItems = [];  

  currentItems.forEach((item, idx) => {
    if (outOfStockIndices.has(idx)) {
      retainedItems.push(item);
    } else {
      filledItems.push(item);
    }
  });

  if (filledItems.length === 0) {
    showToast("No available items to invoice", false);
    return;
  }

  try {
    // 1. SAVE TO COMPLETED SECTION
    await addDoc(collection(db, "invoices"), {
      invoiceNumber: invoiceNum,
      originalOrderId: currentDocId,
      customer: currentOrderData.customer,
      items: filledItems, 
      grandTotal: filledItems.reduce((acc, i) => acc + (parseFloat(i.price)*parseFloat(i.qty)), 0),
      rep: currentOrderData.rep,
      timestamp: serverTimestamp(),
      type: "NVAT"
    });

    // 2. HANDLE NOT COMPLETED SECTION
    if (retainedItems.length === 0) {
      await deleteDoc(doc(db, "orders", currentDocId));
      showToast("Order Fully Completed!", true);
    } else {
      await updateDoc(doc(db, "orders", currentDocId), {
        items: retainedItems, 
        status: "Partial",
        lastUpdated: serverTimestamp()
      });
      showToast("Invoice Saved. Red items stayed in Pending.", true);
    }
    
    closeModal();

  } catch (err) {
    console.error(err);
    showToast("Error saving data.", false);
  }
}

// 8. Calculator
function openCalc(index) {
  const item = currentItems[index];
  if (!item) return;
  highlightRow(index);
  document.getElementById("calcCode").innerText = item.code;
  document.getElementById("calcItemName").innerText = item.desc;
  calcPrice.value = item.price; 
  calcInput.value = ""; 
  calcResult.innerText = "0.00%";
  calcBox.style.display = "block";
  setTimeout(() => calcBox.classList.add("show"), 10);
  calcInput.focus();
}

function calculate() {
  const inputVal = parseFloat(calcInput.value);
  const priceVal = parseFloat(calcPrice.value);
  if (!inputVal || !priceVal) return;
  const result = ((inputVal - priceVal) / inputVal * 100).toFixed(2);
  calcResult.innerText = `${result}%`;
  calcResult.style.color = result < 0 ? "#ef4444" : "#10b981";
}
calcInput.oninput = calculate;
calcPrice.oninput = calculate;

function closeCalc() {
  calcBox.classList.remove("show");
  setTimeout(() => calcBox.style.display = "none", 200);
}

async function saveAndCloseCalc() {
  const input = parseFloat(calcInput.value);
  const item = currentItems[currentIndex];
  const resultTxt = calcResult.innerText.replace(/[^\d.-]/g, "");
  await navigator.clipboard.writeText(resultTxt);
  await updateDoc(doc(db, "orders", currentDocId), {
    [`calculations.${item.code}`]: { input, basePrice: parseFloat(calcPrice.value), margin: resultTxt }
  });
  closeCalc();
  currentIndex++; 
}

// 9. Global Events
document.addEventListener("keydown", (e) => {
  // Prevent triggers when typing in inputs
  if (e.target.tagName === "INPUT") {
    if (inputModal.style.display === "flex") {
      if (e.key === "Enter") submitNVAT();
      if (e.key === "Escape") closeInputModal();
    }
    return;
  }

  // KEY "h" or "H" -> TOGGLE COMPLETED SECTION
  if (e.key.toLowerCase() === "h") {
    toggleCompleted();
    return;
  }

  // KEY "+" -> OPEN NVAT (Only if Modal is Active)
  if (e.key === "+" || e.code === "NumpadAdd") {
    if (modal.style.display === "flex") {
      e.preventDefault();
      openInputModal();
    }
    return;
  }

  if (modal.style.display === "flex") {
    const isCalcOpen = calcBox.style.display === "block";
    if (e.key === "Enter" && isCalcOpen) { saveAndCloseCalc(); return; }
    if (e.code === "Space" && !isCalcOpen) {
      e.preventDefault();
      if (currentIndex < currentItems.length) openCalc(currentIndex);
    }
  }
});

let toastTimeout;
function showToast(msg, isSuccess = false) {
  toastMsg.innerText = msg;
  toast.className = `toast ${isSuccess ? 'success' : ''} active`;
  toastIcon.className = isSuccess ? "fa-solid fa-check" : "fa-solid fa-triangle-exclamation";
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove("active"), 2000); 
}

window.closeModal = () => {
  modal.classList.remove("active");
  setTimeout(() => modal.style.display = "none", 300);
  closeCalc();
};

window.onclick = (e) => { if (e.target === modal) window.closeModal(); };
</script>
</body>
